[package]
name = "rusternetes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "All-in-one Kubernetes in a single binary"

[[bin]]
name = "rusternetes"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = [
    "rusternetes-storage/sqlite",
    "rusternetes-api-server/sqlite",
    "rusternetes-scheduler/sqlite",
    "rusternetes-controller-manager/sqlite",
    "rusternetes-kubelet/sqlite",
    "rusternetes-kube-proxy/sqlite",
    "rusternetes-dns/sqlite",
]
redis = [
    "rusternetes-storage/redis",
    "rusternetes-api-server/redis",
    "rusternetes-scheduler/redis",
    "rusternetes-controller-manager/redis",
    "rusternetes-kubelet/redis",
    "rusternetes-kube-proxy/redis",
    "rusternetes-dns/redis",
]
# Heap profiling via dhat (off by default). Build with
# `--features dhat-heap` to swap in dhat's allocator; on a clean shutdown
# (SIGINT) it writes `dhat-heap.json` with per-backtrace allocation sizes,
# used to attribute the all-in-one's idle RAM (#1138). Pure Rust — no jeprof.
dhat-heap = ["dep:dhat"]

[dependencies]
rusternetes-api-server = { path = "../api-server" }
rusternetes-scheduler = { path = "../scheduler" }
rusternetes-controller-manager = { path = "../controller-manager" }
rusternetes-kubelet = { path = "../kubelet" }
rusternetes-kube-proxy = { path = "../kube-proxy" }
rusternetes-dns = { path = "../dns" }
rusternetes-client = { path = "../client" }
rusternetes-netstack = { path = "../netstack" }
rusternetes-storage = { path = "../storage" }
rusternetes-common = { path = "../common" }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dhat = { version = "0.3", optional = true }
