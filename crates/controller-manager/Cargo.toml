[package]
name = "rusternetes-controller-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "rusternetes_controller_manager"
path = "src/lib.rs"

[[bin]]
name = "controller-manager"
path = "src/main.rs"

[dependencies]
rusternetes-common = { path = "../common" }
# api-client: StorageBackend::Api + the ApiStorage adapter used by run_with_api.
rusternetes-storage = { path = "../storage", features = ["api-client"] }
rusternetes-client = { path = "../client" }
rusternetes-cloud-providers = { path = "../cloud-providers", optional = true }
tokio.workspace = true
fnv = "1.0"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
cron = "0.12"
ipnet = "2"
sha2 = "0.10"
rand = "0.9"
jsonwebtoken.workspace = true
rcgen.workspace = true
pem.workspace = true
base64.workspace = true
async-trait = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
x509-parser = { workspace = true }

[features]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]
cloud-providers = ["rusternetes-cloud-providers"]
aws = ["cloud-providers", "rusternetes-cloud-providers/aws"]
gcp = ["cloud-providers", "rusternetes-cloud-providers/gcp"]
azure = ["cloud-providers", "rusternetes-cloud-providers/azure"]
all-cloud-providers = ["aws", "gcp", "azure"]
