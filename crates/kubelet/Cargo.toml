[package]
name = "rusternetes-kubelet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "kubelet"
path = "src/main.rs"

[lib]
name = "rusternetes_kubelet"
path = "src/lib.rs"

[features]
mimalloc = ["dep:mimalloc"]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
rusternetes-common = { path = "../common" }
# api-client: StorageBackend::Api lets the in-cluster kubelet read/write via
# the api-server while keeping its Arc<StorageBackend> handle unchanged.
rusternetes-storage = { path = "../storage", features = ["api-client"] }
rusternetes-client = { path = "../client" }
rusternetes-netstack = { path = "../netstack" }
rusternetes-cri = { path = "../cri" }
rusternetes-streamproxy = { path = "../streamproxy" }
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
chrono.workspace = true
axum.workspace = true
futures-util = "0.3"
async-stream.workspace = true
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tonic.workspace = true
tonic-health.workspace = true
prost.workspace = true
http = "1"
tar = "0.4"
sysinfo = "0.32"
rustix = { version = "0.38", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
url = "2.5"
tower = { workspace = true }
http-body-util = "0.1"
