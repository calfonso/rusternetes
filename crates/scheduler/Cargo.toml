[package]
name = "rusternetes-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "rusternetes_scheduler"
path = "src/lib.rs"

[[bin]]
name = "scheduler"
path = "src/main.rs"

[features]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]

[dependencies]
rusternetes-common = { path = "../common" }
rusternetes-storage = { path = "../storage" }
rusternetes-client = { path = "../client" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
axum.workspace = true
uuid.workspace = true
async-trait.workspace = true
chrono.workspace = true

[dev-dependencies]
uuid.workspace = true
# Cross-cutting integration tests (e.g. preemption -> ReplicaSet status
# recovery, item #17 in docs/conformance/IGNORED_TESTS_PLAN.md) drive the
# `ReplicaSetController` reconcile loop against the same `MemoryStorage`
# the scheduler mutates. Listed dev-only so the production scheduler binary
# stays decoupled from the controller-manager crate.
rusternetes-controller-manager = { path = "../controller-manager" }
# Shared resource-fixture builders (e.g. `node_with_resources`), default
# feature only — the api-server harness is not needed here.
rusternetes-test-support = { path = "../test_support" }
