[package]
name = "rusternetes-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
jsonwebtoken.workspace = true
prometheus.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile = "2.1"
axum = { workspace = true, optional = true }
bytes = "1"
tokio = { workspace = true, features = ["fs", "io-util", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
aes-gcm = "0.10"
base64 = "0.22"
# CSR (PKCS#10) parsing for CertificateSigningRequest.spec.request validation
# (upstream certificates ValidateCertificateSigningRequest -> validateCSR).
pem = "3.0"
x509-parser = "0.16"
regex = "1.10"
once_cell = "1.19"
cron = "0.12"
# IANA tz-DB lookup for CronJob spec.timeZone existence check (upstream
# validateTimeZone's time.LoadLocation). Same crate/version the CronJob
# controller resolves zones with, so create-validation and scheduling agree.
chrono-tz = "0.10"
etcd-client.workspace = true
sha2 = "0.10.9"
reqwest = { workspace = true }
cel.workspace = true
prost.workspace = true
prost-types.workspace = true

[features]
default = []
axum-support = ["axum"]

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"
serial_test = { workspace = true }
criterion = "0.5"
futures = "0.3"
testcontainers = "0.23"
# Structural parity test against the canonical Kubernetes OpenAPI types.
# `schemars` exposes the upstream JSON Schema we diff our structs against.
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_35", "schemars"] }
schemars = "1"

[[bench]]
name = "regex_cache"
harness = false
