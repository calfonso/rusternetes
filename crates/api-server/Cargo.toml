[package]
name = "rusternetes-api-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "rusternetes_api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/main.rs"

[features]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pprof", "integration-tests"))'] }

[dependencies]
rusternetes-common = { path = "../common", features = ["axum-support"] }
rusternetes-middleware = { path = "../middleware" }
rusternetes-discovery = { path = "../discovery" }
rusternetes-protobuf = { path = "../protobuf" }
rusternetes-admission-webhook = { path = "../admission-webhook" }
rusternetes-storage = { path = "../storage" }
rusternetes-cri = { path = "../cri" }
flate2 = { version = "1.1", features = ["zlib"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde_ignored = "0.1"
ciborium.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
async-stream = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
openapiv3 = "2.2.0"
indexmap = "2.14"
tokio-tungstenite = "0.21"
bytes = "1.5"
get_if_addrs = "0.5"
# rustls-only: the default features pull reqwest's native-tls → openssl-sys,
# which drags OpenSSL into the all-in-one (breaks the musl static build and the
# rustls-only goal). #1041.
prometheus-http-query = { version = "0.8", default-features = false, features = [
    "rustls-tls",
] }
url = "2.5.8"
cel.workspace = true
sha2 = "0.10"
prost.workspace = true
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
rusternetes-controller-manager = { path = "../controller-manager" }
rusternetes-test-support = { path = "../test_support", features = ["apiserver-harness"] }
warp.workspace = true
async-trait.workspace = true
protox-parse = "0.7"
prost-types = "0.13"
serial_test = { workspace = true }
rcgen.workspace = true
rustls.workspace = true
