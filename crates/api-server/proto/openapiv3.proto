//
// Minimal subset of gnostic's openapiv3 proto schema, sufficient for serving
// the rusternetes OpenAPI v3 sub-documents over the proto Accept header.
// The upstream file (github.com/google/gnostic openapiv3/OpenAPIv3.proto) is
// ~700 messages; we only model `Document`, `Info`, `Paths`, `NamedPathItem`,
// `PathItem`, plus the small `Any` / `NamedAny` envelopes that the upstream
// types depend on. Decoding rusternetes' response with the full upstream
// schema is wire-compatible because every field uses the gnostic field
// numbers, and unknown fields are tolerated by proto3.
//
// K8s client-go consumes this via the negotiated content type
// `application/com.github.proto-openapi.spec.v3@v1.0+protobuf`
// (see staging/src/k8s.io/client-go/openapi3 in upstream Kubernetes).

syntax = "proto3";

package openapi.v3;

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_outer_classname = "OpenAPIProto";
option java_package = "org.openapi_v3";
option objc_class_prefix = "OAS";
option go_package = "./openapiv3;openapi_v3";

// `Any` mirrors gnostic's wrapper: callers either store the raw protobuf
// `google.protobuf.Any` or a YAML/JSON string. Carry both so future fields
// can extend without changing the wire format.
message Any {
  google.protobuf.Any value = 1;
  string yaml = 2;
}

message NamedAny {
  string name = 1;
  Any value = 2;
}

// `Document` is the top-level message gnostic emits when parsing an OpenAPI
// v3 spec. Field numbers match the upstream definition so any consumer that
// reads our bytes with the canonical schema sees the same content.
message Document {
  string openapi = 1;
  Info info = 2;
  // servers, paths, components, security, tags, externalDocs follow in the
  // upstream schema — only `paths` is needed for the negotiation tests and
  // for clients that just want to enumerate available group/versions.
  Paths paths = 4;
  repeated NamedAny specification_extension = 9;
}

// `Info` carries the document metadata. Only `title` and `version` are
// required by the OpenAPI 3.0 spec; the rest stay optional.
message Info {
  string title = 1;
  string description = 2;
  string terms_of_service = 3;
  string version = 6;
  repeated NamedAny specification_extension = 7;
}

// `Paths` is the named map of path -> PathItem. Gnostic models the map as a
// repeated `NamedPathItem` to keep ordering stable for the proto wire format.
message Paths {
  repeated NamedPathItem path = 1;
  repeated NamedAny specification_extension = 2;
}

message NamedPathItem {
  string name = 1;
  PathItem value = 2;
}

// `PathItem` carries the per-path operations. Rusternetes' v3 spec stores
// operations as full OpenAPI Operation objects; in this minimal subset we
// only need to round-trip the path keys + descriptions, so we lift the
// operation summary/description out as plain strings rather than modelling
// the full Operation message tree.
message PathItem {
  string _ref = 1;
  string summary = 2;
  string description = 3;
}
