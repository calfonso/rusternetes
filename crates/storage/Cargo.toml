[package]
name = "rusternetes-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:rhino"]
redis = ["dep:rhino"]
# Enables the StorageBackend::Api variant + ApiStorage adapter (Storage trait
# over the api-server REST client). Opt-in so the default storage build (and
# leaf consumers like the api-server) stay lean. Components running as
# api-server clients (kubelet/controller-manager/kube-proxy, the all-in-one)
# enable it via `rusternetes-storage/api-client`.
api-client = ["dep:rusternetes-client"]

[dependencies]
rusternetes-common = { path = "../common" }
rusternetes-client = { path = "../client", optional = true }
rhino = { path = "../../rhino", optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
etcd-client.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
# `testcontainers` spins up real etcd via Docker so the etcd backend tests
# exercise the live wire protocol instead of being permanently `#[ignore]`d.
# Requires Docker (or Podman with the Docker-compat socket) on the host;
# CI / dev environments already have Docker available.
testcontainers = "0.23"
criterion = "0.5"
tempfile = "3.27.0"

[[bench]]
name = "watch_latency"
harness = false
