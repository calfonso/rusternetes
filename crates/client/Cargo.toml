[package]
name = "rusternetes-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = "0.1"
# rustls only — this crate must never pull in openssl.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

[dev-dependencies]
tempfile = "3"
# Live reflector e2e test (#1126): boot the real api-server router on a TCP
# socket and drive the Reflector against it. test-support gives the router +
# MemoryStorage; axum::serve binds it; tokio needs net + a multi-thread runtime.
rusternetes-test-support = { path = "../test_support", features = [
    "apiserver-harness",
] }
axum = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
    "net",
    "rt-multi-thread",
] }
