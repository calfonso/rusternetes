[package]
name = "rusternetes-cri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "rusternetes_cri"
path = "src/lib.rs"

# CRI v1 gRPC client for the kubelet. Talks the Kubernetes Container Runtime
# Interface (runtime.v1) to a CRI-conformant runtime such as containerd, instead
# of the Docker API (bollard). The proto under proto/ is vendored verbatim from
# the kubernetes v1.35 checkout (staging/src/k8s.io/cri-api) and generated at
# build time by tonic-build — no external CRI crate is trusted on our behalf.

[dependencies]
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
# UDS connector: tonic 0.12 rides hyper 1.x, so a tokio UnixStream must be wrapped
# in hyper_util's TokioIo before tonic's transport will accept it.
hyper-util = { version = "0.1", features = ["client", "tokio"] }
# Stream helpers (exec/attach/log): WebSocket client for CRI streaming server.
tokio-tungstenite = "0.21"
url = "2.5.8"
rusternetes-common = { path = "../common" }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { workspace = true }
