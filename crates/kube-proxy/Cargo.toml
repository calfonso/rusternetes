[package]
name = "rusternetes-kube-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "rusternetes_kube_proxy"
path = "src/lib.rs"

[[bin]]
name = "kube-proxy"
path = "src/main.rs"

[features]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]

[dependencies]
rusternetes-common = { path = "../common" }
rusternetes-storage = { path = "../storage" }
rusternetes-client = { path = "../client" }
# For the shared ApiStorage adapter (Storage-trait-over-REST), reused by the
# in-cluster API-client mode. TODO(#follow-up): extract ApiStorage into a small
# shared crate so kube-proxy doesn't depend on the whole control-plane crate.
rusternetes-controller-manager = { path = "../controller-manager" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
