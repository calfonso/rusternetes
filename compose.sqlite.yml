# Podman Compose — SQLite mode via Rhino (no etcd).
#
# Rhino speaks the etcd v3 gRPC API backed by SQLite.
# All components use their existing --etcd-servers flag pointed at rhino.
#
# Usage:
#   podman compose -f compose.sqlite.yml build
#   podman compose -f compose.sqlite.yml up -d
#   bash scripts/bootstrap-cluster.sh
#
# Requires the rhino repo adjacent to this one:
#   dev/
#     rusternetes/   (this repo)
#     rhino/         (https://github.com/calfonso/rhino)

# Per-build sccache toggle for the Dockerfile.services cargo-builder stage.
# CI (GITHUB_ACTIONS=true) -> USE_SCCACHE=1 -> sccache (prior behavior, no
# regression). Local dev (GITHUB_ACTIONS unset) -> USE_SCCACHE="" -> cargo
# incremental, ~10x faster leaf-crate rebuilds (4s vs 39s, measured). The
# /sccache mount is single-machine and never reaches MinIO from this docker
# path, so it only costs the CARGO_INCREMENTAL=0 tax locally. Force either
# way with `USE_SCCACHE=1 docker compose ... build`.
x-sccache-args: &sccache-args
  USE_SCCACHE: "${USE_SCCACHE-${GITHUB_ACTIONS:+1}}"

services:
  # Rhino - etcd-compatible gRPC server backed by SQLite
  rhino:
    build:
      context: ./rhino
      dockerfile: ../Dockerfile.rhino
    container_name: rusternetes-rhino
    restart: unless-stopped
    ports:
      - "2379:2379"
    volumes:
      - rhino-data:/data/db
    networks:
      - rusternetes-net
    command:
      - "--listen-address"
      - "0.0.0.0:2379"
      - "--endpoint"
      - "/data/db/state.db"
      - "--max-connections"
      - "20"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.services
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
      target: api-server
    container_name: rusternetes-api-server
    restart: unless-stopped
    ports:
      - "6443:6443"
    depends_on:
      rhino:
        condition: service_healthy
    networks:
      rusternetes-net:
        aliases:
          - api-server
    volumes:
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
      - /run/podman/podman.sock:/run/podman/podman.sock:rw
    environment:
      - RUST_LOG=info
      - DOCKER_HOST=unix:///run/podman/podman.sock
    command:
      - "--bind-address"
      - "0.0.0.0:6443"
      - "--etcd-servers"
      - "http://rhino:2379"
      - "--tls"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      - "--skip-auth"
      - "--console-dir"
      - "/app/console"
      - "--log-level"
      - "info"

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.services
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
      target: scheduler
    container_name: rusternetes-scheduler
    restart: unless-stopped
    depends_on:
      - rhino
      - api-server
    networks:
      - rusternetes-net
    environment:
      - RUST_LOG=info
    command: ["--etcd-servers", "http://rhino:2379", "--interval", "1"]

  # Controller Manager
  controller-manager:
    build:
      context: .
      dockerfile: Dockerfile.services
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
      target: controller-manager
    container_name: rusternetes-controller-manager
    restart: unless-stopped
    depends_on:
      - rhino
      - api-server
    networks:
      - rusternetes-net
    volumes:
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
    environment:
      - RUST_LOG=info
    command: ["--etcd-servers", "http://rhino:2379", "--sync-interval", "5"]

  # Kubelet
  kubelet:
    build:
      context: .
      dockerfile: Dockerfile.services
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
      target: kubelet
    container_name: rusternetes-kubelet
    restart: unless-stopped
    privileged: true
    depends_on:
      - rhino
      - api-server
    networks:
      - rusternetes-net
    volumes:
      - /run/podman/podman.sock:/run/podman/podman.sock:rw
      # rshared so tmpfs mounts the kubelet makes for Memory-medium emptyDir
      # volumes propagate back to the host mount namespace, where the Docker
      # daemon resolves the app-container bind mounts. Without shared
      # propagation the tmpfs is invisible to app containers and is destroyed
      # on container restart (breaks emptyDir data persistence — #445).
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared
      - ./.rusternetes/certs:/root/.rusternetes/certs:ro
    environment:
      - RUST_LOG=info
      - RUST_MIN_STACK=8388608
      - DOCKER_HOST=unix:///run/podman/podman.sock
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}
    command: ["--node-name", "node-1", "--etcd-servers", "http://rhino:2379", "--cluster-dns", "10.96.0.10", "--metrics-port", "10250", "--sync-interval", "3"]

  # Kubelet 2
  kubelet2:
    build:
      context: .
      dockerfile: Dockerfile.services
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
      target: kubelet
    container_name: rusternetes-kubelet2
    restart: unless-stopped
    privileged: true
    depends_on:
      - rhino
      - api-server
    networks:
      - rusternetes-net
    volumes:
      - /run/podman/podman.sock:/run/podman/podman.sock:rw
      # rshared so tmpfs mounts the kubelet makes for Memory-medium emptyDir
      # volumes propagate back to the host mount namespace, where the Docker
      # daemon resolves the app-container bind mounts. Without shared
      # propagation the tmpfs is invisible to app containers and is destroyed
      # on container restart (breaks emptyDir data persistence — #445).
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared
      - ./.rusternetes/certs:/root/.rusternetes/certs:ro
    environment:
      - RUST_LOG=info
      - RUST_MIN_STACK=8388608
      - DOCKER_HOST=unix:///run/podman/podman.sock
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}
    command: ["--node-name", "node-2", "--etcd-servers", "http://rhino:2379", "--cluster-dns", "10.96.0.10", "--metrics-port", "10251", "--sync-interval", "3"]

  # Kube-proxy (host network mode for iptables)
  kube-proxy:
    build:
      context: .
      dockerfile: Dockerfile.services
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
      target: kube-proxy
    container_name: rusternetes-kube-proxy
    restart: unless-stopped
    privileged: true
    network_mode: host
    user: "0:0"
    depends_on:
      - api-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      # Mount the host kernel module tree so kube-proxy can `modprobe
      # br_netfilter` at startup (the container is privileged). Without
      # br_netfilter the bridge-nf-call-iptables sysctl cannot be enabled, so
      # L2-bridged traffic to a node IP:nodePort bypasses the host-netns
      # NodePort DNAT rules and NodePort Services are unreachable from pods
      # (ClusterIP still works — it is L3-routed through the host).
      # See crates/kube-proxy/src/iptables.rs (modprobe + sysctl on startup).
      - /lib/modules:/lib/modules:ro
    environment:
      - RUST_LOG=info
    command: ["--node-name", "node-1", "--etcd-servers", "http://localhost:2379"]

  dns:
    build:
      context: .
      dockerfile: Dockerfile.services
      target: dns
      additional_contexts:
        rhino: ./rhino
      args: *sccache-args
    container_name: rusternetes-dns
    restart: unless-stopped
    depends_on:
      rhino:
        condition: service_healthy
    networks:
      rusternetes-net:
        aliases:
          - dns
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - RUST_LOG=info
    command:
      - "--etcd-servers"
      - "http://rhino:2379"
      - "--cluster-zone"
      - "cluster.local"
      - "--udp-bind"
      - "0.0.0.0:53"
      - "--tcp-bind"
      - "0.0.0.0:53"

networks:
  rusternetes-net:
    driver: bridge
    name: rusternetes-network

volumes:
  rhino-data:
    name: rusternetes-rhino-data
