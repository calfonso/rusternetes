---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
---
# Standard kubernetes service in default namespace
# This is what clients use to discover the API server
# Pin to 10.96.0.1 for stability (first service in the cluster)
apiVersion: v1
kind: Service
metadata:
  name: kubernetes
  namespace: default
  labels:
    component: apiserver
    provider: kubernetes
spec:
  clusterIP: "10.96.0.1"
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 6443
  type: ClusterIP
---
# Built-in PriorityClasses (K8s creates these automatically)
# system-node-critical: highest priority, for node-level system pods
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: system-node-critical
value: 2000001000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Used for system critical pods that must not be moved from their current node."
---
# system-cluster-critical: high priority, for cluster-level system pods (CoreDNS, etc.)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: system-cluster-critical
value: 2000000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Used for system critical pods that must run in the cluster but can be moved to another node if necessary."
---
# CoreDNS Service (kube-dns)
#
# The Service is ALWAYS created so its ClusterIP (10.96.0.10) stays stable —
# every Pod's /etc/resolv.conf references it via kubelet's --cluster-dns flag.
# The backend (rusternetes-dns container by default, or a CoreDNS Pod when
# USE_RUSTERNETES_DNS=0) is wired in separately by bootstrap-cluster.sh.
# The CoreDNS Pod + ConfigMap live in bootstrap-coredns.yaml, applied only
# on the USE_RUSTERNETES_DNS=0 path.
# Pin to 10.96.0.10 for stability (like real Kubernetes often does)
# This ensures kubelet always discovers the same DNS IP
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
spec:
  selector:
    k8s-app: kube-dns
  clusterIP: "10.96.0.10"
  ports:
  - name: dns
    port: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    protocol: TCP
  - name: metrics
    port: 9153
    protocol: TCP
