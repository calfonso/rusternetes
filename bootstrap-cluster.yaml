---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
---
# Standard kubernetes service in default namespace
# This is what clients use to discover the API server
# Pin to 10.96.0.1 for stability (first service in the cluster)
apiVersion: v1
kind: Service
metadata:
  name: kubernetes
  namespace: default
  labels:
    component: apiserver
    provider: kubernetes
spec:
  clusterIP: "10.96.0.1"
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 6443
  type: ClusterIP
---
# Built-in PriorityClasses (K8s creates these automatically)
# system-node-critical: highest priority, for node-level system pods
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: system-node-critical
value: 2000001000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Used for system critical pods that must not be moved from their current node."
---
# system-cluster-critical: high priority, for cluster-level system pods (DNS, etc.)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: system-cluster-critical
value: 2000000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Used for system critical pods that must run in the cluster but can be moved to another node if necessary."
---
# kube-dns Service (backed by rusternetes-dns)
#
# The Service is ALWAYS created so its ClusterIP (10.96.0.10) stays stable —
# every Pod's /etc/resolv.conf references it via kubelet's --cluster-dns flag.
# The backend — the rusternetes-dns kube-system Deployment from
# bootstrap-dns.yaml, or the all-in-one container's in-process DNS task — is
# wired in separately by bootstrap-cluster.sh (Step 5). CoreDNS has been
# removed; rusternetes-dns is the only backend.
# Pin to 10.96.0.10 for stability (like real Kubernetes often does)
# This ensures kubelet always discovers the same DNS IP
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: rusternetes-dns
spec:
  selector:
    k8s-app: kube-dns
  clusterIP: "10.96.0.10"
  ports:
  - name: dns
    port: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    protocol: TCP
  - name: metrics
    port: 9153
    protocol: TCP
---
# RBAC for the in-cluster scheduler (#1129).
#
# generate-certs.sh emits a CN=system:kube-scheduler / O=system:kube-scheduler
# client cert + scheduler.conf; with --client-ca-file set, the api-server now
# maps that verified cert to user `system:kube-scheduler` (group
# `system:kube-scheduler`) via x509 authn. These objects grant that user the
# verbs the scheduler actually issues.
#
# Seeded unconditionally: harmless (inert) while the api-server runs with
# --skip-auth (the authorizer is bypassed), and already in place the day
# --skip-auth is dropped. Minimal set — narrower than upstream's
# system:kube-scheduler ClusterRole; widen here as the scheduler grows.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:kube-scheduler
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/binding"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:kube-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: system:kube-scheduler
