# Helm values for the gha-runner-scale-set release `arc-runner-set`.
#
# Apply with:
#
#   helm upgrade arc-runner-set \
#     --namespace arc-runners \
#     --reuse-values \
#     --values ci/arc-runner/values.yaml \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# `--reuse-values` keeps githubConfigUrl + githubConfigSecret set at
# install time so we don't have to re-pass them.
#
# `controllerServiceAccount` is set explicitly because the chart's
# label-based auto-discovery of the gha-rs-controller deployment fails
# on this cluster (--dry-run runs in --dry-run=client which skips the
# lookup, and even in a live upgrade the discovery is fragile). The
# controller lives in the arc-systems namespace with SA
# arc-gha-rs-controller.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/indyjonesnl/rusternetes-arc-runner:latest
        # The default actions-runner image entrypoint runs the listener;
        # we keep that here so the custom image stays a drop-in replacement.
        command: ["/home/runner/run.sh"]
