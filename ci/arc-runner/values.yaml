# Helm values for the gha-runner-scale-set release `arc-runner-set`.
#
# Apply with:
#
#   helm upgrade arc-runner-set \
#     --namespace arc-runners \
#     --reuse-values \
#     --values ci/arc-runner/values.yaml \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# `--reuse-values` keeps githubConfigUrl + githubConfigSecret set at
# install time so we don't have to re-pass them.
#
# `controllerServiceAccount` is set explicitly because the chart's
# label-based auto-discovery of the gha-rs-controller deployment fails
# on this cluster (--dry-run runs in --dry-run=client which skips the
# lookup, and even in a live upgrade the discovery is fragile). The
# controller lives in the arc-systems namespace with SA
# arc-gha-rs-controller.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/indyjonesnl/rusternetes-arc-runner:latest
        # The default actions-runner image entrypoint runs the listener;
        # we keep that here so the custom image stays a drop-in replacement.
        command: ["/home/runner/run.sh"]
        env:
          # Cap parallel rustc invocations per pod. Cargo defaults to
          # `nproc`, which on a 7.5-CPU node gives 7-8 concurrent rustc
          # processes peaking at ~5.5 GiB resident — observed on a
          # 2026-05-18 eviction (kubelet reclaimed the runner with
          # `Container runner was using 5748148Ki, request is 0`). At 4
          # jobs the peak drops to ~3-4 GiB and three runners co-fit on
          # the 14 GiB node without eviction.
          - name: CARGO_BUILD_JOBS
            value: "4"
        resources:
          # Requests-only (no limits): kubelet's eviction prefers pods
          # exceeding their request, so we want the request high enough
          # that ordinary compile peaks stay UNDER it; bursts beyond it
          # are allowed but only get evicted when the node itself is
          # under pressure. Limits would convert bursts into hard
          # OOMKills, which is worse for transient compile spikes.
          requests:
            memory: 4Gi
            # 2 cores requested matches the productive parallelism we
            # actually want from CARGO_BUILD_JOBS=4 (cargo will burst
            # to 4 rustc threads when other pods are idle, but the
            # scheduler reserves 2). Big node (7.5 CPU) fits three of
            # these comfortably; small nodes (~0.5 CPU allocatable)
            # can't, which is fine since they can't run a real Rust
            # compile anyway.
            cpu: "2"
