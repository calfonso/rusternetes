# Helm values for the gha-runner-scale-set release `arc-runner-set`
# (the heavy / nextest-tier runner). Workflow jobs select it via
# `runs-on: arc-runner-set`. For the small tier (clippy, fmt) see
# `values-small.yaml`.
#
# Apply with:
#
#   helm upgrade arc-runner-set \
#     --namespace arc-runners \
#     --reuse-values \
#     --values ci/arc-runner/values-large.yaml \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# `--reuse-values` keeps githubConfigUrl + githubConfigSecret set at
# install time so we don't have to re-pass them.
#
# `controllerServiceAccount` is set explicitly because the chart's
# label-based auto-discovery of the gha-rs-controller deployment fails
# on this cluster (--dry-run runs in --dry-run=client which skips the
# lookup, and even in a live upgrade the discovery is fragile). The
# controller lives in the arc-systems namespace with SA
# arc-gha-rs-controller.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

template:
  spec:
    # Pod-level security context. runAsNonRoot satisfies the
    # `restricted` Pod Security Standard and matches the upstream
    # actions/runner image, which runs as user `runner` (uid 1001).
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: ghcr.io/indyjonesnl/rusternetes-arc-runner:latest
        # The default actions-runner image entrypoint runs the listener;
        # we keep that here so the custom image stays a drop-in replacement.
        command: ["/home/runner/run.sh"]
        # Container-level security context — `restricted` PSS aligned.
        # The runner image does not need to escalate privileges or any
        # Linux capabilities: it runs Cargo + Rust toolchain + GitHub
        # Actions runner agent, none of which require uid 0 or CAP_*.
        # Drops the whole capability set and forbids setuid/setgid bits
        # so a compromised job (e.g. a malicious fork PR) cannot pivot
        # to root inside the container. See:
        #   https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        # DinD-mode runners (e.g. the conformance tier) cannot use this
        # block — the docker-in-docker sidecar requires privileged + a
        # writable root FS. Keep this file scoped to the rootless tiers.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          # Cap parallel rustc invocations per pod. Cargo defaults to
          # `nproc`, which on a 7.5-CPU node gives 7-8 concurrent rustc
          # processes peaking at ~5.5 GiB resident — observed on a
          # 2026-05-18 eviction. At 4 jobs the peak drops to ~3-4 GiB
          # for clippy/check, but the full nextest run (workspace test
          # binaries + linker peaks) still spikes near 8 GiB, which is
          # why the request below is 8Gi.
          - name: CARGO_BUILD_JOBS
            value: "4"
        resources:
          # Requests-only (no limits): kubelet's eviction prefers pods
          # exceeding their request, so we want the request high enough
          # that ordinary compile peaks stay UNDER it; bursts beyond it
          # are allowed but only get evicted when the node itself is
          # under pressure. Limits would convert bursts into hard
          # OOMKills, which is worse for transient compile spikes.
          requests:
            # Nextest workspace runs peak at ~8 GiB resident on this
            # ARC image (full target/ link + concurrent test binaries).
            # 4Gi (the previous value) caused repeated kubelet evictions
            # on PRs that landed multi-crate test changes. Bumped to 8Gi
            # so the request matches the observed steady-state peak; a
            # 14 GiB node now fits exactly one large runner plus a small
            # one with headroom for system pods.
            memory: 8Gi
            # 2 cores requested matches the productive parallelism we
            # actually want from CARGO_BUILD_JOBS=4 (cargo will burst
            # to 4 rustc threads when other pods are idle, but the
            # scheduler reserves 2).
            cpu: "2"
