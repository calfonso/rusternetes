name: Bring up rusternetes cluster (sqlite/dind + Hydrophone)
description: >
  Confirm docker, install kubectl + Hydrophone, build images, bring up the
  compose.sqlite.yml + compose.dind.yml stack, discover the bridge gateway,
  wait for api-server health, and bootstrap. Shared by the conformance canary
  and the per-feature matrix. node-conformance uses a different stack and does
  NOT use this action.
inputs:
  hydrophone-version:
    description: Hydrophone release tag
    required: false
    default: v0.7.0
  kubectl-version:
    description: kubectl release tag (match the conformance image)
    required: false
    default: v1.35.0
  image-tag:
    description: >-
      GHCR image tag to pull (e.g. sha-<sha> or main) instead of building
      locally. Empty = build locally (previous behavior). On pull failure the
      action logs a warning and falls back to the local build.
    required: false
    default: ""
outputs:
  kubeconfig:
    description: Path to the generated kubeconfig
    value: ${{ steps.kubeconfig.outputs.path }}
runs:
  using: composite
  steps:
    - name: Confirm Docker daemon
      shell: bash
      run: |
        docker version
        docker info --format '{{ .ServerVersion }}'

    - name: Check docker-compose v2 plugin
      # The runner image (ci/arc-runner/Dockerfile) bakes in v2.30.3.
      # Fail fast if the plugin is missing or older than the floor —
      # rebuilding the runner image is the correct fix, not papering
      # over it in this workflow.
      shell: bash
      env:
        REQUIRED_COMPOSE_VERSION: v2.30.0
      run: |
        set -euo pipefail
        if ! docker compose version --short >/dev/null 2>&1; then
          echo "docker compose plugin missing — rebuild the ARC runner image (ci/arc-runner/Dockerfile)" >&2
          exit 1
        fi
        ACTUAL="v$(docker compose version --short)"
        if ! printf '%s\n%s\n' "$REQUIRED_COMPOSE_VERSION" "$ACTUAL" | sort -V -C; then
          echo "docker compose $ACTUAL is older than required $REQUIRED_COMPOSE_VERSION — rebuild the ARC runner image (ci/arc-runner/Dockerfile)" >&2
          exit 1
        fi
        echo "docker compose $ACTUAL (>= $REQUIRED_COMPOSE_VERSION)"

    - name: Generate TLS certs
      shell: bash
      run: |
        bash scripts/generate-certs.sh

    - name: Set KUBELET_VOLUMES_PATH and CERTS_PATH
      shell: bash
      run: |
        echo "KUBELET_VOLUMES_PATH=$GITHUB_WORKSPACE/.rusternetes/volumes" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/.rusternetes/volumes"
        # Pre-create every host dir that compose bind-mounts, so the Docker
        # daemon does not create it as root on `up` (the runner then can't
        # write into it). .rusternetes/manifests holds the templated
        # control-plane static pod YAML written by bootstrap-cluster.sh AFTER
        # `compose up` — without this, that step dies with "Permission denied"
        # (conformance canary red since the static-pod control-plane landed,
        # 2026-06-12). Mirrors the volumes mkdir above.
        mkdir -p "$GITHUB_WORKSPACE/.rusternetes/manifests"
        # CERTS_PATH MUST be set before the first `compose up`. The kubelet
        # bind-mounts certs at ${CERTS_PATH}:${CERTS_PATH} (compose.sqlite.yml)
        # so the kube-scheduler / kube-controller-manager static pods can
        # hostPath-mount the certs dir at an absolute path that resolves
        # identically inside the kubelet container and on the Docker host.
        # bootstrap-cluster.sh templates that same host-absolute path into the
        # static-pod manifests. If CERTS_PATH is unset at `up` time the kubelet
        # falls back to mounting certs at /etc/rusternetes/certs, the manifest
        # hostPath ($GITHUB_WORKSPACE/.rusternetes/certs) then fails the
        # kubelet's existence check, and both control-plane static pods hang in
        # Pending forever — no scheduler, no controller-manager, broken cluster
        # under conformance (#1153). Export it here so every `up` in this action
        # (initial + gateway restart) mounts certs at the host-absolute path.
        echo "CERTS_PATH=$GITHUB_WORKSPACE/.rusternetes/certs" >> "$GITHUB_ENV"

    - name: Write kubeconfig
      # The repo doesn't ship a kubeconfig — it's user-maintained
      # locally at ~/.kube/rusternetes-config. Construct a minimal
      # one for the runner. Inside the runner pod (which shares its
      # network namespace with the dind sidecar), the api-server's
      # published port 6443 is reachable on localhost. `--skip-auth`
      # on the api-server (compose.sqlite.yml) means any bearer token is
      # accepted, so the placeholder works.
      id: kubeconfig
      shell: bash
      run: |
        mkdir -p "$HOME/.kube"
        cat > "$HOME/.kube/rusternetes-config" <<'EOF'
        apiVersion: v1
        kind: Config
        clusters:
          - name: rusternetes
            cluster:
              insecure-skip-tls-verify: true
              server: https://localhost:6443
        contexts:
          - name: rusternetes
            context:
              cluster: rusternetes
              user: admin
        current-context: rusternetes
        users:
          - name: admin
            user:
              token: anonymous
        EOF
        echo "KUBECONFIG=$HOME/.kube/rusternetes-config" >> "$GITHUB_ENV"
        echo "path=$HOME/.kube/rusternetes-config" >> "$GITHUB_OUTPUT"

    - name: Install kubectl
      # The ARC runner image (ci/arc-runner/Dockerfile) bakes Rust + protoc
      # + docker-compose but not kubectl, so `kubectl ... 2>/dev/null`
      # silently 127's and any wait-loop spins forever (run 26127584434
      # timed out for exactly this reason). Pin to match the conformance
      # image so kubectl never lags the cluster API surface.
      # Drop into the runner user's local bin and append to GITHUB_PATH
      # — no sudo (the runner image's sudo config is not guaranteed).
      shell: bash
      run: |
        set -euo pipefail
        KUBECTL_VERSION="${{ inputs.kubectl-version }}"
        mkdir -p "$HOME/.local/bin"
        curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
          "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
          -o "$HOME/.local/bin/kubectl"
        chmod +x "$HOME/.local/bin/kubectl"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/kubectl" version --client

    - name: Pull prebuilt images or build locally
      # With inputs.image-tag set, try the GHCR-published images first
      # (publish-images.yml pushes sha-<sha> + main tags on every main push).
      # GHCR_OVERLAY + RUSTERNETES_IMAGE_TAG are exported to GITHUB_ENV so the
      # up/restart steps below compose with the same image names. Pull failure
      # (tag missing, registry down, publish still running) falls back to the
      # local build — same path as image-tag="".
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        # --profile build includes the build-only dns image: it runs as an
        # in-cluster Deployment (bootstrap-dns.yaml), not a compose container.
        if [ -n "$IMAGE_TAG" ]; then
          export RUSTERNETES_IMAGE_TAG="$IMAGE_TAG"
          if docker compose -f compose.sqlite.yml -f compose.dind.yml -f compose.ghcr.yml --profile build pull; then
            # bootstrap-dns.yaml references rusternetes-dns:latest with
            # imagePullPolicy IfNotPresent — retag the pulled GHCR image so
            # the kubelet's local-image lookup finds it.
            docker tag "ghcr.io/indyjonesnl/rusternetes/dns:$IMAGE_TAG" rusternetes-dns:latest
            # Same problem for the control-plane STATIC PODS (landed 2026-06-12):
            # manifests/control-plane/{kube-controller-manager,kube-scheduler}.yaml
            # hardcode `image: rusternetes-{controller-manager,scheduler}:latest`
            # with imagePullPolicy IfNotPresent. Under the GHCR overlay those
            # local `:latest` names don't exist (images arrive as ghcr.io/.../*
            # :$IMAGE_TAG), so the kubelet falls back to docker.io and 404s, the
            # static pods never start, and the "Verify control-plane static pods
            # are Running" step fails the whole bring-up (every workflow_run-
            # triggered canary red since the static-pod control-plane landed).
            # Retag both so IfNotPresent resolves locally, exactly like dns.
            docker tag "ghcr.io/indyjonesnl/rusternetes/controller-manager:$IMAGE_TAG" rusternetes-controller-manager:latest
            docker tag "ghcr.io/indyjonesnl/rusternetes/scheduler:$IMAGE_TAG" rusternetes-scheduler:latest
            echo "GHCR_OVERLAY=-f compose.ghcr.yml" >> "$GITHUB_ENV"
            echo "RUSTERNETES_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
            echo "using prebuilt images: tag=$IMAGE_TAG"
            exit 0
          fi
          echo "::warning::prebuilt images tag=$IMAGE_TAG not pullable — falling back to local build"
        fi
        docker compose -f compose.sqlite.yml -f compose.dind.yml --profile build build --parallel

    - name: Bring up cluster
      shell: bash
      run: |
        # Initial up creates the bridge network (needed before we can
        # discover the gateway.  KUBERNETES_SERVICE_HOST_OVERRIDE will
        # be wrong until the restart step below.
        # ${GHCR_OVERLAY:-} expands to "-f compose.ghcr.yml" when the pull
        # step succeeded, "" otherwise. --no-build keeps a half-missing pull
        # from silently recompiling.
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} up -d --no-build
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} ps

    - id: discover-gateway
      name: Discover docker bridge gateway
      shell: bash
      run: |
        GW=$(docker network inspect rusternetes-network -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || echo "")
        if [ -z "$GW" ]; then
          GW=$(ip route show | grep "docker0" | grep -oP 'inet\K[0-9./]+' | head -1 | cut -d/ -f1 | rev | cut -d. -f2,3,4 | rev | sed 's/\.[0-9]*$/.1/')
        fi
        if [ -z "$GW" ]; then
          echo "ERROR: Could not discover docker bridge gateway" >&2
          exit 1
        fi
        echo "gateway=$GW" >> "$GITHUB_OUTPUT"
        echo "DOCKER_GATEWAY=$GW" >> "$GITHUB_ENV"
        echo "Docker bridge gateway: $GW"

    - name: Restart cluster with discovered gateway
      # Write .env so compose interpolates the real gateway on restart.
      # The kubelet inside the container now sees the correct IP.
      shell: bash
      run: |
        echo "DOCKER_GATEWAY=${{ steps.discover-gateway.outputs.gateway }}" > .env
        echo "KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}" >> .env
        # Persist CERTS_PATH (set in GITHUB_ENV before the first `up`) into .env
        # too, so compose interpolation and any manual re-up keep mounting certs
        # at the host-absolute path the static-pod manifests reference (#1153).
        echo "CERTS_PATH=${CERTS_PATH}" >> .env
        if [ -n "${RUSTERNETES_IMAGE_TAG:-}" ]; then
          echo "RUSTERNETES_IMAGE_TAG=${RUSTERNETES_IMAGE_TAG}" >> .env
        fi
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} up -d --no-build
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} ps

    - name: Wait for api-server health
      # NOTE: composite-action steps do NOT support `timeout-minutes` at
      # the step level (GitHub limitation). The 90×2s loop self-bounds to
      # ~3 min, matching the canary's step-level timeout. The caller's job
      # `timeout-minutes` is the real ceiling for runaway cases.
      shell: bash
      run: |
        # Runner default `bash -e` makes `OUT=$(kubectl ... 2>&1)` exit
        # silently on the first kubectl failure: bash propagates the
        # non-zero status of the command substitution and dies before
        # `RC=$?` runs. The whole step died in <100ms with no output
        # (run 26359713718, 2026-05-24). The retry loop *expects*
        # kubectl to fail until api-server is listening, so opt out of -e.
        set +e
        # Earlier loop piped kubectl through `grep -q ok`, which swallowed
        # every stderr line (run 26147385703 — 3 min of "waiting" with no
        # diagnostic). Surface the actual kubectl output each iteration so
        # the failure mode (TLS, refused, no route) is visible in the log.
        for i in $(seq 1 90); do
          OUT=$(kubectl get --raw=/healthz 2>&1)
          RC=$?
          if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q ok; then
            echo "api-server healthy after ${i} attempts: $OUT"
            kubectl get nodes
            exit 0
          fi
          printf '[%02d] kubectl rc=%d: %s\n' "$i" "$RC" "$OUT"
          sleep 2
        done
        echo "api-server never became healthy — dumping diagnostics:"
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} ps || true
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} logs --tail=50 rusternetes || true
        curl -kv --max-time 5 https://127.0.0.1:6443/healthz || true
        curl -kv --max-time 5 https://localhost:6443/healthz || true
        exit 1

    - name: Bootstrap cluster (CoreDNS, services, SA tokens)
      shell: bash
      run: bash scripts/bootstrap-cluster.sh

    - name: Verify control-plane static pods are Running
      # The kube-scheduler / kube-controller-manager static pods must reach
      # Running before handing off to hydrophone. If they hang Pending (e.g.
      # the CERTS_PATH hostPath regression #1153), nothing schedules and
      # Deployments never expand — conformance then runs against a broken
      # control plane and reports meaningless junk. Fail fast here instead.
      shell: bash
      run: |
        set +e
        pods="kube-controller-manager-node-1 kube-scheduler-node-1"
        for i in $(seq 1 60); do
          ok=1
          for p in $pods; do
            phase=$(kubectl get pod "$p" -n kube-system -o jsonpath='{.status.phase}' 2>/dev/null)
            [ "$phase" = "Running" ] || ok=0
          done
          if [ "$ok" -eq 1 ]; then
            echo "control-plane static pods Running after ${i} attempts"
            kubectl get pods -n kube-system -o wide
            exit 0
          fi
          sleep 2
        done
        echo "control-plane static pods did not reach Running — dumping diagnostics:"
        kubectl get pods -n kube-system -o wide || true
        for p in $pods; do kubectl describe pod "$p" -n kube-system || true; done
        docker compose -f compose.sqlite.yml -f compose.dind.yml ${GHCR_OVERLAY:-} logs --tail=80 kubelet || true
        exit 1

    - name: Install Hydrophone
      # Pinned binary; callers expect it on PATH after this action runs.
      shell: bash
      run: |
        set -e
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
          -o /tmp/hydrophone.tar.gz \
          "https://github.com/kubernetes-sigs/hydrophone/releases/download/${{ inputs.hydrophone-version }}/hydrophone_Linux_x86_64.tar.gz"
        tar -xzf /tmp/hydrophone.tar.gz -C "$HOME/.local/bin" hydrophone
        chmod +x "$HOME/.local/bin/hydrophone"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        hydrophone --help | head -5
