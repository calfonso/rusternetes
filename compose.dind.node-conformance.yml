# Compose override that points the node-conformance api-server + kubelet
# at /var/run/docker.sock (the standard docker daemon socket) instead of
# /run/podman/podman.sock.
#
# Apply alongside compose.node-conformance.yml when running on a host
# whose container runtime is Docker (not Podman) — most notably the
# GitHub Actions self-hosted runners in ARC + the gha-runner-scale-set
# DinD sidecar, which exposes its daemon at /var/run/docker.sock.
#
# Usage:
#   docker compose -f compose.node-conformance.yml \
#                  -f compose.dind.node-conformance.yml up -d
#
# This is the node-conformance analogue of compose.dind.yml (multi-
# container) and compose.dind.all-in-one.yml (single binary). Same
# pattern: list-typed `volumes` and `environment` merge as concatenation
# with last-wins semantics, so the override entries take precedence at
# the bollard / Docker SDK lookup level.

services:
  api-server:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

  kubelet:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
