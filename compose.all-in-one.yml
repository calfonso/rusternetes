# All-in-one rusternetes with embedded SQLite storage.
#
# Single container — no etcd, no Redis, no external dependencies.
# The entire cluster runs as one binary with SQLite for state.
#
# Usage:
#   podman compose -f compose.all-in-one.yml build
#   podman compose -f compose.all-in-one.yml up -d
#
# Requires the rhino repo adjacent to this one:
#   dev/
#     rusternetes/   (this repo)
#     rhino/         (https://github.com/calfonso/rhino)

services:
  rusternetes:
    build:
      context: ..
      dockerfile: rusternetes/Dockerfile.all-in-one
      args:
        CARGO_FEATURES: sqlite
    container_name: rusternetes
    # `privileged: true` covers NET_ADMIN / NET_RAW (kube-proxy iptables)
    # plus the kubelet's mount / cgroup manipulation, so one knob.
    privileged: true
    ports:
      - "6443:6443"
      - "10250:10250"
    networks:
      - rusternetes-net
    volumes:
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
      - /run/podman/podman.sock:/run/podman/podman.sock:rw,z
      - /run/podman/podman.sock:/var/run/docker.sock:rw,z
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw
      - sqlite-data:/data/db
    environment:
      - RUST_LOG=info
      - DOCKER_HOST=unix:///run/podman/podman.sock
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}
      # Pod-facing endpoint: Docker bridge gateway [subnet].1 (set by
      # bootstrap at runtime via discover-bridge-gateway.sh). The host's
      # 6443:6443 port mapping forwards to the in-process api-server —
      # no known subnet required.
      - KUBERNETES_SERVICE_HOST_OVERRIDE=${DOCKER_GATEWAY}
    command:
      - "--storage-backend"
      - "sqlite"
      - "--data-dir"
      - "/data/db/rusternetes.db"
      - "--tls"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      - "--skip-auth"
      # kube-proxy now runs in-process (no `--disable-proxy`). The image
      # ships iptables / iproute2 for that — see Dockerfile.all-in-one.
      - "--console-dir"
      - "/app/console"
      - "--network"
      - "rusternetes-network"
      - "--cluster-dns"
      - "10.96.0.10"
      - "--volume-dir"
      - "${KUBELET_VOLUMES_PATH}"

networks:
  rusternetes-net:
    driver: bridge
    name: rusternetes-network

volumes:
  sqlite-data:
    name: rusternetes-sqlite-data
