apiVersion: apps/v1
kind: Deployment
metadata:
  name: chuck-norris-web
  namespace: chuck-norris
  labels:
    app: chuck-norris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chuck-norris
  template:
    metadata:
      labels:
        app: chuck-norris
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: chuck-norris-html
