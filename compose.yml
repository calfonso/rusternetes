services:
  # etcd - distributed key-value store for cluster state
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: rusternetes-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --auto-compaction-retention=10m
      - --auto-compaction-mode=periodic
      - --snapshot-count=5000
      - --quota-backend-bytes=8589934592
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - rusternetes-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - ETCDCTL_API=3

  # API Server - central management component
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: api-server
      additional_contexts:
        # crates/storage/Cargo.toml declares rhino as `path = "../../rhino"`,
        # which resolves outside the rusternetes build context. Expose the
        # adjacent rhino checkout as a named context so each Dockerfile can
        # `COPY --from=rhino` into the right spot.
        rhino: ./rhino
    container_name: rusternetes-api-server
    # NET_ADMIN lets the entrypoint install a route to the pod CIDR
    # (10.244.0.0/16) via the containerd container, so the pod/service proxy
    # subresources can reach pod IPs that live in containerd's CNI netns.
    cap_add:
      - NET_ADMIN
    ports:
      - "6443:6443"
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      rusternetes-net:
        aliases:
          - api-server
    volumes:
      # Mount persistent TLS certificates
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
      # CRI socket from the containerd service: the api-server reads container
      # stats (metrics) and runs exec/logs over CRI, not a Docker socket.
      - containerd-run:/run/containerd
      # Pod container logs. containerd writes each container's stdout/stderr
      # under ${KUBELET_VOLUMES_PATH}/pod-logs/...; GET pods/<p>/log is served by
      # the api-server reading those files off the filesystem at the SAME
      # absolute path the CRI ContainerStatus.log_path reports (see
      # api-server/handlers/pod_subresources.rs::stream_container_logs).
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:ro
    environment:
      - RUST_LOG=info
      - CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock
      - RUSTERNETES_DUMP_PAYLOADS=${RUSTERNETES_DUMP_PAYLOADS:-}
    command:
      - "--bind-address"
      - "0.0.0.0:6443"
      - "--etcd-servers"
      - "http://etcd:2379"
      - "--tls"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      - "--skip-auth"
      - "--console-dir"
      - "/app/console"
      - "--log-level"
      - "info"

  # Scheduler — build-only. The scheduler runs as a static pod on node-1
  # (manifests/control-plane/kube-scheduler.yaml), launched by the node-1
  # kubelet — not as its own compose service. This service exists only so
  # `compose --profile build build` produces rusternetes-scheduler:latest for
  # the static pod. It never starts under `up` (gated by the `build` profile).
  scheduler:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: scheduler
      additional_contexts:
        rhino: ./rhino
    image: rusternetes-scheduler:latest

  # Controller Manager — build-only. Runs in-cluster as a static pod on node-1
  # (manifests/control-plane/kube-controller-manager.yaml, API mode via
  # ApiStorage); `compose --profile build build` produces
  # rusternetes-controller-manager:latest for the static pod. It never starts
  # under `up` (gated by the `build` profile).
  controller-manager:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: controller-manager
      additional_contexts:
        rhino: ./rhino
    image: rusternetes-controller-manager:latest

  # Shared CRI runtime: containerd (CRI plugin) + Youki. The kubelets talk to
  # this over CRI v1 instead of a Docker/Podman socket; pods run as containers
  # inside this service. The CRI socket is shared with the kubelets via the
  # `containerd-run` volume, and KUBELET_VOLUMES_PATH is bind-mounted at the same
  # host path so the pod volumes the kubelet provisions resolve here too.
  containerd:
    image: rusternetes-containerd:latest
    build:
      context: .
      dockerfile: Dockerfile.containerd
    container_name: rusternetes-containerd
    restart: unless-stopped
    privileged: true
    networks:
      - rusternetes-net
    volumes:
      - containerd-run:/run/containerd
      # /var/lib/containerd (the overlayfs snapshotter root) must live on a real
      # filesystem, not the container's own overlay rootfs — nested overlay
      # mounts fail with "invalid argument". A named volume is host-fs-backed.
      - containerd-data:/var/lib/containerd
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared
      - ${CERTS_PATH:-./.rusternetes/certs}:${CERTS_PATH:-/etc/rusternetes/certs}:ro

  # Kubelet - node agent that manages containers
  kubelet:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: kubelet
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-kubelet
    privileged: true
    depends_on:
      - etcd
      - api-server
      - containerd
    networks:
      - rusternetes-net
    volumes:
      # CRI socket shared from the containerd service.
      - containerd-run:/run/containerd
      # Share volume directory so ConfigMap/Secret volumes can be mounted into pods.
      # rshared so kubelet tmpfs mounts (Memory-medium emptyDir) propagate to the
      # host daemon and persist across container restarts (#445).
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared
      # Mount TLS certificates so kubelet can inject CA cert into service account volumes
      - ./.rusternetes/certs:/root/.rusternetes/certs:ro
      # Templated control-plane static pod manifests (kube-scheduler) +
      # host-absolute certs mount for the scheduler static pod's hostPath. See
      # the matching block in compose.sqlite.yml for the full rationale.
      - ./.rusternetes/manifests:/etc/rusternetes/manifests:ro
      - ${CERTS_PATH:-./.rusternetes/certs}:${CERTS_PATH:-/etc/rusternetes/certs}:ro
    environment:
      - RUST_LOG=info
      - CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}
      - RUSTERNETES_DUMP_PAYLOADS=${RUSTERNETES_DUMP_PAYLOADS:-}
    command: ["--node-name", "node-1", "--api-server-url", "https://api-server:6443", "--kubeconfig", "/root/.rusternetes/certs/kubelet.conf", "--cluster-dns", "10.96.0.10", "--metrics-port", "10250", "--sync-interval", "3", "--pod-manifest-path", "/etc/rusternetes/manifests"]

  # Kubelet 2 - second node agent for multi-node conformance tests
  kubelet2:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: kubelet
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-kubelet2
    privileged: true
    depends_on:
      - etcd
      - api-server
      - containerd
    networks:
      - rusternetes-net
    volumes:
      # CRI socket shared from the containerd service.
      - containerd-run:/run/containerd
      # rshared so Memory-medium emptyDir tmpfs mounts propagate to the host
      # mount namespace and survive container restarts (#445).
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared
      - ./.rusternetes/certs:/root/.rusternetes/certs:ro
    environment:
      - RUST_LOG=info
      - CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}
      - RUSTERNETES_DUMP_PAYLOADS=${RUSTERNETES_DUMP_PAYLOADS:-}
    command: ["--node-name", "node-2", "--api-server-url", "https://api-server:6443", "--kubeconfig", "/root/.rusternetes/certs/kubelet.conf", "--cluster-dns", "10.96.0.10", "--metrics-port", "10250", "--sync-interval", "3"]

  # Kube-proxy runs INSIDE the containerd service's network namespace
  # (network_mode: service:containerd) so its iptables Service rules live where
  # the pods are: pod IPs come from CNI (cni0, 10.244.0.0/16) inside containerd,
  # which the host netns cannot reach. Sharing containerd's netns lets ClusterIP
  # DNAT resolve to real pod IPs. It reaches the api-server over the compose
  # network (containerd is attached to rusternetes-net) at api-server:6443.
  kube-proxy:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: kube-proxy
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-kube-proxy
    privileged: true
    network_mode: "service:containerd"
    user: "0:0"
    depends_on:
      - containerd
      - api-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      # Mount the host kernel module tree so kube-proxy can `modprobe
      # br_netfilter` at startup (the container is privileged). Without
      # br_netfilter the bridge-nf-call-iptables sysctl cannot be enabled, so
      # L2-bridged traffic to a node IP:nodePort bypasses the host-netns
      # NodePort DNAT rules and NodePort Services are unreachable from pods
      # (ClusterIP still works — it is L3-routed through the host).
      # See crates/kube-proxy/src/iptables.rs (modprobe + sysctl on startup).
      - /lib/modules:/lib/modules:ro
      # kube-proxy.conf (CA-only kubeconfig) for API mode — see generate-certs.sh.
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
    environment:
      - RUST_LOG=info
    # API mode: read cluster state from the api-server via ApiStorage (no storage
    # handle). Sharing containerd's netns → api-server reached at its compose
    # alias api-server:6443.
    command: ["--node-name", "node-1", "--api-server-url", "https://api-server:6443", "--kubeconfig", "/etc/kubernetes/pki/kube-proxy.conf"]

  # DNS - authoritative cluster.local DNS server, build-only. The dns
  # binary no longer runs as a compose container: bootstrap-cluster.sh
  # applies bootstrap-dns.yaml, which deploys this image as a kube-system
  # Deployment (k8s-app=kube-dns) reading cluster state from the
  # api-server. Kubelets share the host docker daemon, so the locally
  # built tag is visible to pods without a registry.
  # Build with: docker compose --profile build build dns
  dns:
    profiles: ["build"]
    image: rusternetes-dns:latest
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
      target: dns
      additional_contexts:
        rhino: ./rhino

networks:
  rusternetes-net:
    driver: bridge
    name: rusternetes-network

volumes:
  etcd-data:
    name: rusternetes-etcd-data
  # CRI socket shared from the containerd service to the kubelets + api-server.
  containerd-run:
    name: rusternetes-containerd-run
  # containerd's snapshotter root on a real (host-fs-backed) volume so the
  # overlayfs snapshotter works inside the Docker-hosted containerd.
  containerd-data:
    name: rusternetes-containerd-data
