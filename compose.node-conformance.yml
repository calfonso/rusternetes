# Single-node compose for kubelet-scoped conformance testing.
# Brings up rhino (etcd-compatible gRPC over SQLite) + api-server + scheduler
# + one kubelet — no controller-manager, no kube-proxy, no second kubelet.
#
# Storage is Rhino + SQLite, matching the conformance canary and CI
# (compose.sqlite.yml) rather than etcd — reproduce conformance on the backend
# we actually ship/test. Rhino speaks the etcd v3 gRPC API, so every component
# keeps its existing `--etcd-servers` flag, pointed at rhino:2379.
#
# The scheduler is required: the upstream e2e.test creates conformance pods
# with `schedulerName: default-scheduler` and no `spec.nodeName`, so without a
# scheduler to bind them to node-1 every test pod sits Pending forever and the
# suite times out (only ~8 of 191 [NodeConformance] specs ever started). The
# per-namespace `kube-root-ca.crt` ConfigMap and default ServiceAccount that the
# pods' projected `kube-api-access` volume needs are created by the api-server
# on namespace creation (handlers/namespace.rs), so the controller-manager is
# not needed here.
#
# Used by scripts/run-node-conformance.sh.

services:
  # Rhino — etcd-compatible gRPC server backed by SQLite (see compose.sqlite.yml).
  rhino:
    build:
      context: ./rhino
      dockerfile: ../Dockerfile.rhino
    container_name: rusternetes-nc-rhino
    ports:
      - "2379:2379"
    volumes:
      - rhino-data:/data/db
    networks:
      - nc-net
    command:
      - "--listen-address"
      - "0.0.0.0:2379"
      - "--endpoint"
      - "/data/db/state.db"
      - "--max-connections"
      - "20"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.services
      target: api-server
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-nc-api-server
    privileged: true
    ports:
      - "6443:6443"
    # NET_ADMIN lets the entrypoint install a route to the pod CIDR
    # (10.244.0.0/16) via the containerd container, so the pod/proxy + log
    # subresources can reach pod IPs that live in containerd's CNI netns.
    # Mirrors compose.sqlite.yml.
    cap_add:
      - NET_ADMIN
    depends_on:
      rhino:
        condition: service_healthy
      containerd:
        condition: service_started
    networks:
      nc-net:
        aliases:
          - api-server
    volumes:
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
      # CRI socket from the containerd service: exec/logs/stats run over CRI v1,
      # not a Docker/Podman socket (the kubelet was cut over to CRI).
      - containerd-run:/run/containerd
      # Pod container logs live under ${KUBELET_VOLUMES_PATH}/pod-logs/...; the
      # api-server serves GET pods/<p>/log by reading them off the filesystem at
      # the same absolute path the CRI ContainerStatus.log_path reports.
      - ${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}:${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}:ro
    environment:
      - RUST_LOG=info
      - CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock
    command:
      - "--bind-address"
      - "0.0.0.0:6443"
      - "--etcd-servers"
      - "http://rhino:2379"
      - "--tls"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      - "--skip-auth"
      - "--console-dir"
      - "/app/console"
      - "--log-level"
      - "info"

  kubelet:
    build:
      context: .
      dockerfile: Dockerfile.services
      target: kubelet
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-nc-kubelet
    privileged: true
    depends_on:
      - rhino
      - api-server
      - containerd
    networks:
      - nc-net
    ports:
      # 10250 is the single kubelet HTTP server port. The kubelet binary
      # merges metrics + /configz + the read-only server router (/healthz,
      # /pods, /runningpods, /stats/summary) onto one axum app behind
      # `--metrics-port` (crates/kubelet/src/main.rs). The api-server's
      # node-proxy handler reaches the kubelet at whatever port
      # `node.status.daemonEndpoints.kubeletEndpoint.port` advertises —
      # set to 10250 in kubelet.rs:518-522. The earlier 10249/10250 split
      # was a placeholder for a separate HTTP server that never landed;
      # with the merged router an api-server -> kubelet proxy to :10250
      # hit a closed port and SynchronizedBeforeSuite's kubelet-pods dump
      # failed (PR #788 follow-up). Pin metrics to 10250 so the advertised
      # port and the listening port match.
      - "10250:10250"
    volumes:
      # CRI socket shared from the containerd service — the kubelet drives pod
      # lifecycle over CRI v1, not a Docker/Podman socket.
      - containerd-run:/run/containerd
      # rshared so the tmpfs mounts the kubelet makes for Memory-medium emptyDir
      # propagate out to the host daemon and into pod containers — otherwise the
      # pod sees the underlying (ext4) bind dir and the emptyDir-tmpfs
      # NodeConformance specs fail with `mount type != tmpfs`. Mirrors
      # compose.sqlite.yml / compose.yml; was missing here since the harness
      # scaffold (#1066).
      - ${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}:${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}:rw,rshared
      - ./.rusternetes/certs:/root/.rusternetes/certs:ro
    environment:
      - RUST_LOG=info
      - CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock
      - KUBERNETES_SERVICE_HOST_OVERRIDE=api-server
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}
    # Pod networking is handled by CNI inside the containerd runtime (cni0,
    # 10.244.0.0/16), so the old bollard-only `--network` flag (which attached
    # pause containers to a Docker bridge) no longer applies — omit it to match
    # the CRI-migrated compose.sqlite.yml kubelet.
    command: ["--node-name", "node-1", "--etcd-servers", "http://rhino:2379", "--cluster-dns", "10.96.0.10", "--metrics-port", "10250", "--sync-interval", "3"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.services
      target: scheduler
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-nc-scheduler
    depends_on:
      - rhino
      - api-server
    networks:
      - nc-net
    environment:
      - RUST_LOG=info
    # Talks straight to rhino (etcd v3 gRPC). Tight 1s interval so the
    # conformance pods bind promptly instead of pacing the suite.
    command: ["--etcd-servers", "http://rhino:2379", "--interval", "1"]

  # Controller-manager: without it nothing finalizes deleted namespaces, so
  # every conformance spec's namespace leaks `Terminating` forever and its pods
  # are never reclaimed — the node fills to its pod cap and later specs fail
  # under resource pressure (#1520). The namespace controller deletes contained
  # resources, drains the `kubernetes` finalizer, and lets the api-server GC the
  # namespace. Tight sync interval to keep up with the suite's churn.
  controller-manager:
    build:
      context: .
      dockerfile: Dockerfile.services
      target: controller-manager
      additional_contexts:
        rhino: ./rhino
    container_name: rusternetes-nc-controller-manager
    depends_on:
      - rhino
      - api-server
    networks:
      - nc-net
    environment:
      - RUST_LOG=info
    command: ["--etcd-servers", "http://rhino:2379", "--sync-interval", "2"]

  # Shared CRI runtime: containerd (CRI plugin) + Youki. The kubelet drives pod
  # lifecycle over CRI v1 through this service instead of a Docker/Podman socket
  # (the kubelet was cut over to CRI — without a containerd here the kubelet's
  # ListPodSandbox/ListContainers fail with "No such file or directory" and
  # every pod sits Pending forever). The CRI socket is shared with the kubelet +
  # api-server via the `containerd-run` volume, and KUBELET_VOLUMES_PATH is
  # bind-mounted at the same host path so pod volumes the kubelet provisions
  # resolve here too. Mirrors compose.sqlite.yml.
  containerd:
    image: rusternetes-containerd:latest
    build:
      context: .
      dockerfile: Dockerfile.containerd
    container_name: rusternetes-nc-containerd
    privileged: true
    networks:
      - nc-net
    volumes:
      - containerd-run:/run/containerd
      # /var/lib/containerd (overlayfs snapshotter root) must live on a real
      # filesystem, not the container's own overlay rootfs — a named volume is
      # host-fs-backed.
      - containerd-data:/var/lib/containerd
      - ${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}:${KUBELET_VOLUMES_PATH:-./.rusternetes/volumes}:rw,rshared
      - ./.rusternetes/certs:/etc/rusternetes/certs:ro

networks:
  nc-net:
    name: rusternetes-nc-net
    driver: bridge

volumes:
  rhino-data:
    name: rusternetes-nc-rhino-data
  # CRI socket shared from the containerd service to the kubelet + api-server.
  containerd-run:
    name: rusternetes-nc-containerd-run
  # containerd's snapshotter root on a real (host-fs-backed) volume so the
  # overlayfs snapshotter works inside the Docker-hosted containerd.
  containerd-data:
    name: rusternetes-nc-containerd-data
