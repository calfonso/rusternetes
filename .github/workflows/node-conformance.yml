name: Node Conformance

# Kubelet-scoped conformance harness. Runs upstream e2e.test with the
# [NodeConformance] focus against a single-node compose stack.
# See docs/NODE_CONFORMANCE.md.

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Ginkgo focus expression"
        required: false
        default: '\[NodeConformance\]'
      k8s_version:
        description: "Upstream Kubernetes test tarball version"
        required: false
        default: "v1.35.0"
      image-tag:
        description: "GHCR image tag to pull (default main; empty = build locally)"
        required: false
        default: main
  schedule:
    # 03:00 UTC nightly. Self-hosted runner; respects the project's GH Actions
    # minute budget (see project memory `project_github_actions_minute_budget`).
    - cron: "0 3 * * *"

jobs:
  node-conformance:
    runs-on: arc-runner-set-conformance
    # contents:write lets the "Update badge" step push the latest pass-rate
    # JSON to the orphan `badges` branch (best-effort; never fails the run).
    permissions:
      contents: write
    # Image build + bootstrap (~15m) plus the ginkgo suite. The suite runs
    # ~190 [NodeConformance] specs; with GINKGO_NODES=4 parallelism a full pass
    # measured ~53m locally, and GINKGO_TIMEOUT defaults to 85m. 120m leaves
    # headroom for setup + the 85m ginkgo ceiling + teardown/artifact upload.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) that the storage crate's
        # `../../rhino` path dep needs on disk for `cargo metadata`.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Tool prereqs (fail fast on missing — no apt-get install)
        # Per project convention: self-hosted runner does not get sudo / apt-get
        # access. Surface missing tools immediately with a clear error.
        run: |
          set -euo pipefail
          for t in docker jq curl tar; do
              command -v "$t" >/dev/null 2>&1 || { echo "missing required tool: $t"; exit 1; }
          done


      - name: Install kubectl
        # bootstrap-cluster.sh (invoked from run-node-conformance.sh) shells
        # out to kubectl for service / SA / CoreDNS setup. The ARC runner
        # image (ci/arc-runner/Dockerfile) does not bake kubectl. Drop it
        # into $HOME/.local/bin so no sudo is needed. Pin to v1.35 to match
        # the upstream conformance image we test against.
        run: |
          set -euo pipefail
          KUBECTL_VERSION="v1.35.0"
          mkdir -p "$HOME/.local/bin"
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kubectl" version --client

      - name: Generate TLS certificates
        run: bash scripts/generate-certs.sh

      - name: Run node conformance
        env:
          CONTAINER_RUNTIME: docker
          KUBELET_VOLUMES_PATH: ${{ github.workspace }}/.rusternetes/volumes
          FOCUS: ${{ github.event.inputs.focus || '\[NodeConformance\]' }}
          K8S_VERSION: ${{ github.event.inputs.k8s_version || 'v1.35.0' }}
          RUSTERNETES_IMAGE_TAG: ${{ github.event_name == 'schedule' && 'main' || github.event.inputs.image-tag }}
          # Nightly uses the `main` tag, which must be pullable once the GHCR
          # packages are public. A miss there means the visibility flip was
          # forgotten — hard-fail rather than silently compile locally forever
          # (#1108). Manual dispatch keeps the soft fallback (an arbitrary or
          # empty image-tag input is a legitimate "build locally" request).
          REQUIRE_PREBUILT: ${{ github.event_name == 'schedule' }}
        run: bash scripts/run-node-conformance.sh

      - name: Upload ginkgo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-conformance-log-${{ github.run_id }}
          path: /tmp/node-conformance/ginkgo.log
          if-no-files-found: warn

      - name: Update node-conformance badge
        # Only publish from a FULL [NodeConformance] sweep. A focus-narrowed
        # manual dispatch (e.g. focus="should function for intra-pod
        # communication" → 2 specs) must NOT clobber the nightly pass-rate.
        # Scheduled runs leave inputs.focus empty (defaults to the full focus);
        # manual runs must keep the default to qualify.
        if: >-
          always() &&
          (github.event.inputs.focus == '' ||
           github.event.inputs.focus == '\[NodeConformance\]')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log=/tmp/node-conformance/ginkgo.log
          [ -f "$log" ] || { echo "no ginkgo.log — skipping badge"; exit 0; }
          # ginkgo summary line, e.g. "SUCCESS! -- 180 Passed | 11 Failed | 0 Pending | 7157 Skipped"
          line=$(grep -oE '[0-9]+ Passed \| [0-9]+ Failed' "$log" | tail -1)
          passed=$(echo "$line" | grep -oE '^[0-9]+')
          failed=$(echo "$line" | sed -nE 's/.*\| ([0-9]+) Failed/\1/p')
          : "${passed:=0}"; : "${failed:=0}"
          total=$((passed + failed))
          # Defense-in-depth: the full sweep is ~190 specs. If far fewer ran the
          # log is from a partial/aborted run — don't publish a bogus pass-rate.
          if [ "$total" -lt 100 ]; then
            echo "only $total specs counted (<100) — partial run, skipping badge"
            exit 0
          fi
          bash scripts/update-badge.sh node-conformance "node conformance" "$passed" "$total"

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f compose.node-conformance.yml \
            down -v --remove-orphans || true
