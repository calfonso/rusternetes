name: Check formatting

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  fmt:
    name: Verify formatting with cargo fmt
    # Runs on the light-tier `arc-runner-set-small` self-hosted scale
    # set, which ships rustup + rustfmt + jq preinstalled; fmt peaks
    # well under 100 MiB.
    runs-on: arc-runner-set-small
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino, indyjonesnl/rhino) that the
        # storage crate's `../../rhino` path dep needs on disk; `cargo fmt
        # --all` / `cargo metadata` fail without it. submodules: recursive
        # checks it out at the pinned commit. fetch-depth: 0 so the
        # change-detection diff below can reach the PR base commit.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        # This is a REQUIRED status check. We keep it always triggered (so the
        # check always reports and PRs stay mergeable), but only run the cargo
        # gate when a PR actually touches Rust-relevant files. A docs / script /
        # compose-only PR reports green in seconds without compiling. Pushes to
        # main always run the full check.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping cargo fmt (required check reports green)."
          fi

      - name: Validate formatting
        if: steps.rust.outputs.changed == 'true'
        # `cargo fmt --all` recurses into path-deps (rhino) too, but the
        # rhino repo has its own rustfmt config and isn't owned by this
        # project. Format only the workspace members enumerated by
        # `cargo metadata --no-deps`.
        run: |
          pkgs=()
          while IFS= read -r name; do
            pkgs+=(-p "$name")
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          cargo fmt "${pkgs[@]}" -- --check
