name: Check formatting

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  fmt:
    name: Verify formatting with cargo fmt
    # Runs on the light-tier `arc-runner-set-small` self-hosted scale
    # set, which ships rustup + rustfmt + jq preinstalled; fmt peaks
    # well under 100 MiB.
    runs-on: arc-runner-set-small
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino, indyjonesnl/rhino) that the
        # storage crate's `../../rhino` path dep needs on disk; `cargo fmt
        # --all` / `cargo metadata` fail without it. submodules: recursive
        # checks it out at the pinned commit.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Validate formatting
        # `cargo fmt --all` recurses into path-deps (rhino) too, but the
        # rhino repo has its own rustfmt config and isn't owned by this
        # project. Format only the workspace members enumerated by
        # `cargo metadata --no-deps`.
        run: |
          PKGS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name' \
            | sed 's/^/-p /' \
            | tr '\n' ' ')
          cargo fmt $PKGS -- --check
