name: Rust tests

on:
  # Run once per change: push events only fire for main (post-merge
  # validation); feature-branch pushes that have an open PR fire via
  # the pull_request `synchronize` event instead. Without the branch
  # filter every PR update would trigger two duplicate runs.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: cargo nextest + clippy
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone rhino adjacent to repo
        # crates/storage/Cargo.toml resolves the optional `rhino` dep via
        # `path = "../../../rhino"`, i.e. as a sibling of $GITHUB_WORKSPACE.
        # The default `sqlite` feature on the rusternetes binary activates
        # this dep, so `cargo metadata` (and therefore every cargo step
        # below) fails unless rhino is present on disk.
        run: |
          if [ ! -d ../rhino ]; then
            git clone --depth 1 https://github.com/calfonso/rhino.git ../rhino
          else
            echo "rhino already present at ../rhino (self-hosted runner workspace persists)"
          fi

      - name: Add cargo bin to PATH
        # Self-hosted runner shells don't source ~/.bashrc, so rustup
        # (installed at ~/.cargo/bin/rustup) is not on PATH by default.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Ensure rustup is installed (self-heal)
        # The self-hosted runner shares its home with the maintainer's
        # interactive session. Twice now `~/.cargo/bin/rustup` has gone
        # missing between runs, which broke the next "Install Rust
        # toolchain" step with `rustup: command not found`. Reinstall
        # idempotently via the official curl-piped script when absent —
        # cheap when present, recovers without operator action when not.
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup missing on runner — reinstalling"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          else
            echo "rustup present: $(command -v rustup)"
          fi

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add --toolchain stable clippy
          rustup default stable

      - name: Install build deps
        # ARC runner pods are ephemeral, so anything the build needs has
        # to be installed per-job until we bake a custom runner image.
        # `sudo` is preconfigured NOPASSWD on the actions-runner user.
        # - protobuf-compiler: protoc for kubelet CRI proto codegen
        # - mold + clang: fast linker for api-server / kubelet binaries
        # - pkg-config + libssl-dev: required by openssl-sys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler mold clang pkg-config libssl-dev
          protoc --version
          mold --version
          clang --version | head -1
          pkg-config --version

      - name: Enable mold linker
        # `.cargo/config.toml` is gitignored (so devs without mold installed
        # can still `cargo build`). CI activates the template before any
        # cargo invocation.
        run: cp .cargo/config.toml.example .cargo/config.toml

      - name: Install cargo-nextest
        # Prebuilt binary install — much faster and more parallel than
        # `cargo test`. The action caches the binary across runs.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo registry + target
        # Runs on BOTH self-hosted and GH-hosted runners. Even though
        # the self-hosted workspace persists between runs, rust-cache
        # adds value: it scopes the cache key to Cargo.lock + rustc
        # version, prunes stale artifacts on miss, and is the safety
        # net when the runner's disk is wiped (which happened during
        # the 2026-05 conformance push and cost ~30min of recompile).
        uses: Swatinem/rust-cache@v2
        with:
          # Bump if you want to invalidate cache without changing deps.
          prefix-key: "v1-rust"

      - name: cargo nextest run (compile + test in one pass)
        # nextest compiles test binaries and runs them in parallel; reuses
        # cargo's incremental compilation cache so this is the only Rust
        # build step needed. --no-fail-fast surfaces all failures per run.
        # Doctests are not run (nextest limitation) — none of the
        # workspace currently depends on doctest coverage; add a separate
        # `cargo test --doc` step if that changes.
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: cargo clippy (informational, all targets)
        # Warnings are surfaced in the run log but do not fail CI yet —
        # the baseline has 30+ pre-existing warnings (deprecated rand
        # APIs, unused methods etc.). Ratchet to `-- -D warnings` after
        # that backlog is cleaned up. Default features only: the
        # optional `jaeger` feature pulls in opentelemetry-jaeger which
        # is itself deprecated upstream.
        #
        # `--all-targets` also acts as the bin-target build check the
        # old explicit `cargo build` step provided — clippy compiles
        # every target before lint, so any compile error in a bin fails
        # this step.
        run: cargo clippy --workspace --all-targets --locked
