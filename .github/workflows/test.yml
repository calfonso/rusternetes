name: Rust tests

on:
  # Run once per change: push events only fire for main (post-merge
  # validation); feature-branch pushes that have an open PR fire via
  # the pull_request `synchronize` event instead. Without the branch
  # filter every PR update would trigger two duplicate runs.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Both jobs run on self-hosted ARC scale sets that ship the Rust
# toolchain (clippy + rustfmt), cargo-nextest, and the system build
# deps (protoc + libprotobuf-dev, mold + clang, pkg-config + libssl-dev).
#
# `cargo nextest` and `cargo clippy` are REQUIRED status checks. To keep
# them mergeable without burning a full compile on PRs that touch no Rust
# (docs / scripts / compose / known-green.txt only), each job stays
# always-triggered but gates its cache+build steps on a change-detection
# step — so the required check still reports green in seconds when there's
# no Rust to build. Pushes to main always run the full job.
#
# Memory budget differs per job, so each picks a differently-sized ARC
# scale set:
#   - `arc-runner-set`       — large tier, for nextest (peaks near 8 GiB)
#   - `arc-runner-set-small` — light tier, for clippy (~250 MiB peak)
jobs:
  nextest:
    name: cargo nextest
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) resolving the storage crate's
        # `../../rhino` path dep. submodules: recursive checks it out pinned.
        # fetch-depth: 0 gives the change-detection diff the PR base commit.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping cargo nextest (required check reports green)."
          fi

      - name: Cache cargo registry + target
        # ARC runner pods are ephemeral; rust-cache restores ~/.cargo
        # and target/ from the GitHub Actions cache scoped to
        # Cargo.lock + rustc version.
        #
        # `save-if: main only` is deliberate: PRs restore from the
        # cache main wrote on the most recent merge, then SKIP the
        # multi-GB upload at job end. Cache uploads from the ARC
        # cluster to the GHA cache service (Azure blob) were eating
        # 1-3 min per PR job; main pays that cost once per Cargo.lock
        # change. PRs that touch Cargo.lock will recompile new deps
        # but still benefit from the warm cache for everything else.
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache namespace from clippy: the test profile and
          # check profile produce different artifacts under target/.
          prefix-key: "v1-rust"
          shared-key: "nextest"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo nextest run
        # `--status-level fail` suppresses per-test PASS lines; the
        # final summary still reports totals. `--no-fail-fast` surfaces
        # every failure in one run instead of stopping at the first.
        # Doctests are not run (nextest limitation) — none of the
        # workspace currently depends on doctest coverage; add a
        # separate `cargo test --doc` step if that changes.
        if: steps.rust.outputs.changed == 'true'
        run: cargo nextest run --workspace --locked --no-fail-fast --status-level fail

      - name: sccache stats
        # Compilation cache hit-rate, for visibility. sccache itself is
        # configured cluster-side via the runner pod env (RUSTC_WRAPPER +
        # SCCACHE_* → the in-cluster MinIO; see indy/arc-runner/sccache-minio
        # + values-*.yaml). It shares rustc artifacts between this job and the
        # clippy job and across successive pushes to a PR. `|| true` keeps a
        # missing/unconfigured sccache from failing the job.
        if: always() && steps.rust.outputs.changed == 'true'
        run: sccache --show-stats || true

  nextest-sqlite:
    name: cargo nextest (sqlite feature)
    # The rhino/SQLite-backed tests in rusternetes-api-server are gated behind
    # `#[cfg(feature = "sqlite")]`, so the default `nextest` job above compiles
    # them out and never runs them — e.g. watch_delivery_rhino_test.rs, which
    # covers the rhino watch-delivery regression class PR #885 fixed. Without
    # this job those tests pass CI silently. The submodule + system deps are
    # already provided by the runner image; we just flip the feature on.
    #
    # Large tier: layering the sqlite driver + rhino on top of api-server peaks
    # well above the light tier clippy uses.
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) resolving the storage crate's
        # `../../rhino` path dep. submodules: recursive checks it out pinned.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping the sqlite nextest job."
          fi

      - name: Cache cargo registry + target
        # Distinct shared-key: the sqlite feature produces different artifacts
        # under target/ than the default-feature nextest job.
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: "nextest-sqlite"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (sqlite feature, hard gate)
        # Lint the sqlite-gated code too — the default clippy job below builds
        # default features only, so `#[cfg(feature = "sqlite")]` paths are
        # otherwise never linted.
        if: steps.rust.outputs.changed == 'true'
        run: cargo clippy -p rusternetes-api-server --all-targets --features sqlite --locked -- -D warnings

      - name: cargo nextest run (sqlite feature)
        if: steps.rust.outputs.changed == 'true'
        run: cargo nextest run -p rusternetes-api-server --features sqlite --locked --no-fail-fast --status-level fail

      - name: sccache stats
        if: always() && steps.rust.outputs.changed == 'true'
        run: sccache --show-stats || true

  clippy:
    name: cargo clippy
    # Clippy peaks at ~250 MiB resident, so it runs on the light-tier
    # `arc-runner-set-small` scale set. Nextest stays on `arc-runner-set`
    # because its workspace test peaks hit ~8 GiB.
    runs-on: arc-runner-set-small
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) resolving the storage crate's
        # `../../rhino` path dep. submodules: recursive checks it out pinned.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping cargo clippy (required check reports green)."
          fi

      - name: Cache cargo registry + target
        # See save-if rationale in the nextest job's cache step.
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (hard gate, all targets)
        # `-- -D warnings` converts every clippy lint into a build error
        # so warnings cannot accrete unnoticed. The backlog that used to
        # block this gate was cleared in `chore(clippy): clear backlog +
        # ratchet test.yml to -D warnings`; future PRs must keep clippy
        # green or `#[allow(<lint>)]` the specific case with a comment.
        #
        # Default features only: the optional `jaeger` feature pulls in
        # opentelemetry-jaeger which is itself deprecated upstream.
        #
        # `--all-targets` also acts as the bin-target build check the
        # old explicit `cargo build` step provided — clippy compiles
        # every target before lint, so any compile error in a bin fails
        # this step.
        if: steps.rust.outputs.changed == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: sccache stats
        # See the nextest job's sccache-stats step. This job populates the
        # shared cache that nextest then reads (and vice-versa).
        if: always() && steps.rust.outputs.changed == 'true'
        run: sccache --show-stats || true
