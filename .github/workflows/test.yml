name: Rust tests

on:
  # Run once per change: push events only fire for main (post-merge
  # validation); feature-branch pushes that have an open PR fire via
  # the pull_request `synchronize` event instead. Without the branch
  # filter every PR update would trigger two duplicate runs.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Both jobs run on the custom ARC image (ci/arc-runner/Dockerfile),
# which ships the Rust toolchain (clippy + rustfmt), cargo-nextest, and
# the system build deps (protoc + libprotobuf-dev, mold + clang,
# pkg-config + libssl-dev). They share an anchor block so the
# repeated setup (checkout, rhino clone, mold enable, rust-cache) stays
# in lock-step.
#
# Memory budget differs per job, so each picks a differently-sized ARC
# scale set:
#   - `arc-runner-set`       — 8Gi/2cpu, for nextest (peaks near 8 GiB)
#   - `arc-runner-set-small` — 512Mi/500m, for clippy (~250 MiB peak)
# Both scale sets share one runner image; only the pod resource
# requests differ. See ci/arc-runner/values-{large,small}.yaml.
jobs:
  nextest:
    name: cargo nextest
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone rhino adjacent to repo
        # crates/storage/Cargo.toml resolves the optional `rhino` dep
        # via `path = "../../../rhino"`. ARC runner pods are ephemeral,
        # so every job clones fresh.
        run: git clone --depth 1 https://github.com/calfonso/rhino.git ../rhino

      - name: Enable mold linker
        # `.cargo/config.toml` is gitignored (so devs without mold
        # installed can still `cargo build`). CI activates the template
        # before any cargo invocation.
        run: cp .cargo/config.toml.example .cargo/config.toml

      - name: Cache cargo registry + target
        # ARC runner pods are ephemeral; rust-cache restores ~/.cargo
        # and target/ from the GitHub Actions cache scoped to
        # Cargo.lock + rustc version.
        #
        # `save-if: main only` is deliberate: PRs restore from the
        # cache main wrote on the most recent merge, then SKIP the
        # multi-GB upload at job end. Cache uploads from the ARC
        # cluster to the GHA cache service (Azure blob) were eating
        # 1-3 min per PR job; main pays that cost once per Cargo.lock
        # change. PRs that touch Cargo.lock will recompile new deps
        # but still benefit from the warm cache for everything else.
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache namespace from clippy: the test profile and
          # check profile produce different artifacts under target/.
          prefix-key: "v1-rust"
          shared-key: "nextest"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo nextest run
        # `--status-level fail` suppresses per-test PASS lines; the
        # final summary still reports totals. `--no-fail-fast` surfaces
        # every failure in one run instead of stopping at the first.
        # Doctests are not run (nextest limitation) — none of the
        # workspace currently depends on doctest coverage; add a
        # separate `cargo test --doc` step if that changes.
        run: cargo nextest run --workspace --locked --no-fail-fast --status-level fail

  clippy:
    name: cargo clippy
    # Clippy peaks at ~250 MiB resident, so it runs on the light-tier
    # scale set (512Mi/500m request) defined by
    # ci/arc-runner/values-small.yaml. Nextest stays on `arc-runner-set`
    # (8Gi/2cpu) because its workspace test peaks hit ~8 GiB.
    runs-on: arc-runner-set-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone rhino adjacent to repo
        run: git clone --depth 1 https://github.com/calfonso/rhino.git ../rhino

      - name: Enable mold linker
        run: cp .cargo/config.toml.example .cargo/config.toml

      - name: Cache cargo registry + target
        # See save-if rationale in the nextest job's cache step.
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: "clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (informational, all targets)
        # Warnings are surfaced in the run log but do not fail CI yet —
        # the baseline has 30+ pre-existing warnings (deprecated rand
        # APIs, unused methods etc.). Ratchet to `-- -D warnings` after
        # that backlog is cleaned up. Default features only: the
        # optional `jaeger` feature pulls in opentelemetry-jaeger which
        # is itself deprecated upstream.
        #
        # `--all-targets` also acts as the bin-target build check the
        # old explicit `cargo build` step provided — clippy compiles
        # every target before lint, so any compile error in a bin fails
        # this step.
        run: cargo clippy --workspace --all-targets --locked
