name: Conformance canary

# A single focused Hydrophone conformance test run against a clean
# rusternetes cluster brought up via `docker compose` inside the
# `arc-runner-set-conformance` scale set (DinD-enabled).
#
# Purpose: prove the ARC → DinD → compose → bootstrap → hydrophone
# pipeline end-to-end, and produce a per-PR regression signal for the
# simplest known-passing upstream conformance test
# (`[sig-node] Pods should be submitted and removed [NodeConformance]
# [Conformance]` — Sonobuoy Round 160 PASS).
#
# Triggers:
#   * workflow_dispatch — manual button on the Actions tab.
#   * pull_request, BUT only when files this workflow actually depends
#     on change (the workflow file itself, the helm values for the
#     conformance scale set, the compose override, the bootstrap +
#     run-conformance scripts). Keeps Actions minutes bounded — see
#     CLAUDE.local.md "GH Actions minute budget tight" — yet still
#     gives us an empirical test of the runner the first time this PR
#     lands.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/conformance-canary.yml'
      - 'ci/arc-runner/values-conformance.yaml'
      - 'compose.dind.yml'
      - 'compose.yml'
      - 'scripts/bootstrap-cluster.sh'
      - 'scripts/run-conformance.sh'
      - 'scripts/conformance-single-test.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/conformance-canary.yml'
      - 'ci/arc-runner/values-conformance.yaml'
      - 'compose.dind.yml'

env:
  # The dind sidecar exposes the daemon at this canonical path; the
  # compose.dind.yml override makes every rusternetes service use it.
  DOCKER_HOST: unix:///var/run/docker.sock
  # The conformance image is small (~270 MiB) and pinning the version
  # avoids surprise upgrades. v1.32 matches docs/CONFORMANCE.md.
  CONFORMANCE_IMAGE: registry.k8s.io/conformance:v1.32.0
  # Pin Hydrophone to a known release so a tag-rename upstream doesn't
  # silently break the workflow.
  HYDROPHONE_VERSION: v0.7.0
  # The single canary test we expect to PASS. Sonobuoy Round 160:
  # `[sig-node] Pods should be submitted and removed [NodeConformance]
  # [Conformance]` was green. If it goes red, something on the
  # current main broke the basic Pod lifecycle.
  CANARY_FOCUS: '\[sig-node\] Pods should be submitted and removed \[NodeConformance\] \[Conformance\]'

jobs:
  hydrophone:
    name: hydrophone (focused canary)
    # Targets the new DinD-enabled scale set installed via
    # ci/arc-runner/values-conformance.yaml. If the scale set isn't
    # deployed yet, this job will sit "queued" forever — see the PR
    # description for the helm-install one-liner that has to run
    # ONCE before this workflow can ever turn green.
    runs-on: arc-runner-set-conformance
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone rhino adjacent to repo
        # Same pre-existing pattern as test.yml — the storage crate's
        # Cargo.toml references `path = "../../../rhino"`. The dind
        # daemon doesn't need it but the compose build context does.
        run: |
          git clone --depth 1 https://github.com/indyjonesnl/rhino.git ../rhino || \
            echo "rhino already cloned"

      - name: Confirm Docker daemon
        run: |
          docker version
          docker info --format '{{ .ServerVersion }}'

      - name: Ensure docker-compose v2 plugin
        # The custom ARC runner image (ci/arc-runner/Dockerfile) bakes
        # this plugin in, so on an up-to-date runner this step is a
        # no-op (`docker compose version` succeeds). The fallback only
        # exists for the chicken-and-egg window where this PR ships
        # both the Dockerfile change AND the conformance workflow — if
        # the runner pod is still on an older image (build-runner-image
        # workflow hasn't published yet), download the plugin into the
        # user-local plugin dir so the workflow still works. Once the
        # new image lands and rolls out, this whole step can be deleted.
        run: |
          set -euo pipefail
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin already present:"
            docker compose version
            exit 0
          fi
          echo "docker compose plugin missing — installing fallback"
          COMPOSE_VERSION="v2.30.3"
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            -o "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version

      - name: Generate TLS certs
        run: |
          bash scripts/generate-certs.sh

      - name: Set KUBELET_VOLUMES_PATH
        run: |
          echo "KUBELET_VOLUMES_PATH=$GITHUB_WORKSPACE/.rusternetes/volumes" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.rusternetes/volumes"

      - name: Write kubeconfig
        # The repo doesn't ship a kubeconfig — it's user-maintained
        # locally at ~/.kube/rusternetes-config. Construct a minimal
        # one for the runner. Inside the runner pod (which shares its
        # network namespace with the dind sidecar), the api-server's
        # published port 6443 is reachable on localhost. `--skip-auth`
        # on the api-server (compose.yml) means any bearer token is
        # accepted, so the placeholder works.
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/rusternetes-config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: rusternetes
              cluster:
                insecure-skip-tls-verify: true
                server: https://localhost:6443
          contexts:
            - name: rusternetes
              context:
                cluster: rusternetes
                user: admin
          current-context: rusternetes
          users:
            - name: admin
              user:
                token: anonymous
          EOF
          echo "KUBECONFIG=$HOME/.kube/rusternetes-config" >> "$GITHUB_ENV"

      - name: Build images
        # Build before `up -d` so the up step is a fast container-start
        # rather than a slow build. Parallel build keeps wall time
        # reasonable on the 3-core conformance tier.
        run: |
          docker compose -f compose.yml -f compose.dind.yml build --parallel

      - name: Bring up cluster
        run: |
          docker compose -f compose.yml -f compose.dind.yml up -d
          docker compose -f compose.yml -f compose.dind.yml ps

      - name: Wait for api-server health
        timeout-minutes: 3
        run: |
          until kubectl get --raw=/healthz 2>/dev/null | grep -q ok; do
            echo "waiting for api-server..."
            sleep 2
          done
          kubectl get nodes

      - name: Bootstrap cluster (CoreDNS, services, SA tokens)
        run: bash scripts/bootstrap-cluster.sh

      - name: Install Hydrophone
        run: |
          set -e
          curl -sSL -o /tmp/hydrophone.tar.gz \
            "https://github.com/kubernetes-sigs/hydrophone/releases/download/${HYDROPHONE_VERSION}/hydrophone_Linux_x86_64.tar.gz"
          tar -xzf /tmp/hydrophone.tar.gz -C /tmp hydrophone
          chmod +x /tmp/hydrophone
          /tmp/hydrophone --help | head -5

      - name: Run canary
        timeout-minutes: 15
        run: |
          set -e
          mkdir -p conformance-out
          /tmp/hydrophone \
            --kubeconfig "$HOME/.kube/rusternetes-config" \
            --conformance-image "$CONFORMANCE_IMAGE" \
            --focus "$CANARY_FOCUS" \
            --output-dir conformance-out \
            --verbosity 4

      - name: Summarise junit
        if: always()
        run: |
          if [ -f conformance-out/junit_01.xml ]; then
            python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          root = ET.parse('conformance-out/junit_01.xml').getroot()
          ts = root.find('testsuite')
          print(f"tests={ts.get('tests')} failures={ts.get('failures')} skipped={ts.get('skipped')}")
          for tc in root.iter('testcase'):
              if tc.find('failure') is not None:
                  print(f"FAIL: {tc.get('name')}")
                  f = tc.find('failure')
                  if f.text:
                      print(f.text[:1500])
          PY
          else
            echo "no junit_01.xml produced — see hydrophone output above"
            exit 1
          fi

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-out
          path: conformance-out/
          retention-days: 14

      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f compose.yml -f compose.dind.yml logs --tail=200 || true
          docker compose -f compose.yml -f compose.dind.yml down -v || true
