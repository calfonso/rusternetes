name: Conformance canary

# A focused Hydrophone conformance test run against a clean rusternetes
# cluster brought up via `docker compose` inside the
# `arc-runner-set-conformance` scale set (DinD-enabled).
#
# Stack: multi-container SQLite (`compose.sqlite.yml` + `compose.dind.yml`).
# Storage is rhino (etcd-compatible gRPC server backed by SQLite) instead of
# etcd. rhino's SQLite driver compacts old revisions and reclaims disk on a
# background loop (`auto_vacuum=incremental` + post-compact `incremental_vacuum`),
# so unlike etcd's fixed `--quota-backend-bytes` it does NOT raise a hard
# `NOSPACE` alarm and wedge writes on a long run — a 3h full run against etcd
# hit the 8 GiB quota and failed 206 tests with cascading `context deadline
# exceeded` (etcd compaction frees bbolt pages but never shrinks the file).
# The
# all-in-one stack was tried first (cheaper, ~400-600 MB) but its kube-
# proxy runs inside the same container netns as the rusternetes process
# and writes iptables rules that the host kernel never consults, so any
# ClusterIP-targeting traffic (notably pod -> CoreDNS at 10.96.0.10)
# silently times out. The multi-container stack runs kube-proxy in its
# own container with `network_mode: host` + CAP_NET_ADMIN, which is the
# only configuration we have where ClusterIP DNAT actually fires for
# pod traffic. Cost is ~1.2 GB cluster memory and ~5 min extra startup
# vs the all-in-one stack.
#
# Purpose: prove the ARC → DinD → compose → bootstrap → hydrophone
# pipeline end-to-end, and report the conformance pass/fail delta across
# the full upstream [Conformance] tag set.
#
# Coverage: the canary no longer enforces the ci/conformance/known-green.txt
# ratchet. It now runs the canonical two-phase [Conformance] tag split via
# `scripts/conformance-tags-run.sh` (phase 1: parallel, skipping
# [Slow]/[Serial]/[Flaky]; phase 2: the [Serial]/[Slow] conformance subset,
# single-threaded). This is DISCOVERY/REPORTING, not a gate: rusternetes is
# not yet 100% conformant, so test failures are expected and do NOT fail the
# job — only an infra failure (hydrophone producing no junit) does. Track the
# delta via the printed counts and the uploaded junit, not a red/green job.
#
# Triggers:
#   * workflow_dispatch — manual button on the Actions tab.
#   * push to main — post-merge smoke test. PR-trigger removed because
#     a full hydrophone run blocks PRs for 30–60 min on cold caches
#     and the canary's value (post-merge conformance reporting) is
#     preserved by the post-merge run plus operator-driven manual
#     dispatches when warranted.
#
# Open follow-ups (canary backlog):
#   - [x] Replace etcd with the SQLite backend for the canary (done: now uses
#         compose.sqlite.yml + rhino). This also removes the etcd 8 GiB
#         NOSPACE wedge that capped long runs — see Stack note above.
#   - [x] Retire the known-green.txt ratchet in favour of the two-phase
#         [Conformance] tag split (conformance-tags-run.sh).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conformance-canary.yml'
      - 'scripts/conformance-tags-run.sh'
      - 'compose.sqlite.yml'
      - 'compose.dind.yml'
      - 'Dockerfile.services'
      - 'Dockerfile.rhino'

env:
  # The dind sidecar exposes the daemon at this canonical path; the
  # compose.dind.yml override makes every service use it instead of the
  # podman socket compose.sqlite.yml hardcodes for dev-laptop parity.
  DOCKER_HOST: unix:///var/run/docker.sock
  # Pin Hydrophone to a known release so a tag-rename upstream doesn't
  # silently break the workflow. The conformance image itself is pinned
  # by `scripts/conformance-tags-run.sh` (defaults to v1.35.0).
  HYDROPHONE_VERSION: v0.7.0

jobs:
  hydrophone:
    name: hydrophone (conformance tags)
    # contents:write lets the "Update badge" step push the latest pass-rate
    # JSON to the orphan `badges` branch (best-effort; never fails the run).
    permissions:
      contents: write
    # Targets the DinD-enabled scale set. If the scale set isn't
    # deployed on the operator's cluster, this job will sit "queued"
    # forever — operator install of the helm release is a manual
    # one-off (not in this repo by design; see PR #191 policy).
    runs-on: arc-runner-set-conformance
    # Build is ~12 min (Dockerfile.services shared builder, PR #190). The
    # two-phase conformance run is the long pole: unlike the old known-green
    # subset (322 specs that all PASS quickly), the full [Conformance] tag
    # set includes specs rusternetes does not yet pass, and each FAILING
    # spec burns its per-test ginkgo timeout before moving on — so wall time
    # scales with the failure count, not just the spec count. The 300-min
    # run-step ceiling bounds a wedged run; the job ceiling clears build +
    # 300 + teardown. If runs routinely hit the ceiling, narrow the focus or
    # split the phases into separate jobs.
    timeout-minutes: 330

    steps:
      - name: Checkout
        # rhino is an in-tree submodule (./rhino, indyjonesnl/rhino). The
        # storage crate's Cargo.toml references `path = "../../rhino"` and the
        # compose files expose it as a named build context
        # (`additional_contexts: rhino: ./rhino`). submodules: recursive
        # checks it out at the pinned commit so the compose build finds it.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bring up cluster
        uses: ./ci/actions/bring-up-cluster
        with:
          hydrophone-version: ${{ env.HYDROPHONE_VERSION }}
          kubectl-version: v1.35.0

      - name: Run conformance tag suite
        # `scripts/conformance-tags-run.sh` runs the canonical two-phase
        # [Conformance] split (phase 1: parallel, skip [Slow]/[Serial]/[Flaky];
        # phase 2: the [Serial]/[Slow] conformance subset, single-threaded),
        # parses each junit, and prints pass/fail/skip counts. It is
        # NON-GATING: test failures are expected (rusternetes is not yet 100%
        # conformant) and do NOT fail this step — only an infra failure
        # (hydrophone producing no junit) exits non-zero. Pins the conformance
        # image to v1.35.0 by default — see the script's --help. Self-hosted
        # runner, no GH minute cost; the long ceiling covers failing specs
        # each burning their per-test timeout (see job timeout note above).
        timeout-minutes: 300
        run: |
          bash scripts/conformance-tags-run.sh \
            --output-dir conformance-out

      - name: Update conformance badge
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=0; failed=0
          shopt -s nullglob
          for j in conformance-out/*/junit_01.xml; do
            p=$(grep -oE 'status="passed"' "$j" | wc -l | tr -d ' ')
            f=$(grep -oE 'status="failed"' "$j" | wc -l | tr -d ' ')
            passed=$((passed + p)); failed=$((failed + f))
          done
          bash scripts/update-badge.sh conformance "conformance" "$passed" "$((passed + failed))"

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-out
          path: conformance-out/
          retention-days: 14

      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f compose.sqlite.yml -f compose.dind.yml logs --tail=200 || true
          docker compose -f compose.sqlite.yml -f compose.dind.yml down -v || true
