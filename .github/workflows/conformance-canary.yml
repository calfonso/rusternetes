name: Conformance canary

# A focused Hydrophone conformance test run against a clean rusternetes
# cluster brought up via `docker compose` inside the
# `arc-runner-set-conformance` scale set (DinD-enabled).
#
# Stack: multi-container SQLite (`compose.sqlite.yml` + `compose.dind.yml`).
# Storage is rhino (etcd-compatible gRPC server backed by SQLite) instead of
# etcd. rhino's SQLite driver compacts old revisions and reclaims disk on a
# background loop (`auto_vacuum=incremental` + post-compact `incremental_vacuum`),
# so unlike etcd's fixed `--quota-backend-bytes` it does NOT raise a hard
# `NOSPACE` alarm and wedge writes on a long run — a 3h full run against etcd
# hit the 8 GiB quota and failed 206 tests with cascading `context deadline
# exceeded` (etcd compaction frees bbolt pages but never shrinks the file).
# The
# all-in-one stack was tried first (cheaper, ~400-600 MB) but its kube-
# proxy runs inside the same container netns as the rusternetes process
# and writes iptables rules that the host kernel never consults, so any
# ClusterIP-targeting traffic (notably pod -> CoreDNS at 10.96.0.10)
# silently times out. The multi-container stack runs kube-proxy in its
# own container with `network_mode: host` + CAP_NET_ADMIN, which is the
# only configuration we have where ClusterIP DNAT actually fires for
# pod traffic. Cost is ~1.2 GB cluster memory and ~5 min extra startup
# vs the all-in-one stack.
#
# Purpose: prove the ARC → DinD → compose → bootstrap → hydrophone
# pipeline end-to-end, and produce a per-PR regression signal for the
# canary's known-green ratchet (ci/conformance/known-green.txt).
#
# Triggers:
#   * workflow_dispatch — manual button on the Actions tab.
#   * push to main — post-merge smoke test. PR-trigger removed because
#     a full hydrophone run blocks PRs for 30–60 min on cold caches
#     and the canary's value (catching ratchet regressions before they
#     reach main) is preserved by the post-merge run plus operator-
#     driven manual dispatches when warranted.
#
# Open follow-ups (canary backlog):
#   - [x] Replace etcd with the SQLite backend for the canary (done: now uses
#         compose.sqlite.yml + rhino). This also removes the etcd 8 GiB
#         NOSPACE wedge that capped long runs — see Stack note above.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conformance-canary.yml'
      - 'ci/conformance/known-green.txt'
      - 'scripts/conformance-canary-run.sh'
      - 'compose.sqlite.yml'
      - 'compose.dind.yml'
      - 'Dockerfile.services'
      - 'Dockerfile.rhino'

env:
  # The dind sidecar exposes the daemon at this canonical path; the
  # compose.dind.yml override makes every service use it instead of the
  # podman socket compose.sqlite.yml hardcodes for dev-laptop parity.
  DOCKER_HOST: unix:///var/run/docker.sock
  # Pin Hydrophone to a known release so a tag-rename upstream doesn't
  # silently break the workflow. The conformance image itself is pinned
  # by `scripts/conformance-canary-run.sh` (defaults to v1.35.0).
  HYDROPHONE_VERSION: v0.7.0

jobs:
  hydrophone:
    name: hydrophone (focused canary)
    # Targets the DinD-enabled scale set. If the scale set isn't
    # deployed on the operator's cluster, this job will sit "queued"
    # forever — operator install of the helm release is a manual
    # one-off (not in this repo by design; see PR #191 policy).
    runs-on: arc-runner-set-conformance
    # 60 min from prior measurements: pre-#190 the conformance tier
    # (3 cpu) compiled each of the five service Dockerfiles separately,
    # ~40-50 min cold. Run 26126002894 timed out at the 30-min ceiling
    # on the scheduler build. PR #190 (Dockerfile.services) consolidated
    # those into one shared builder stage; the new steady-state cold
    # build hasn't been measured yet. Build is ~12 min; the conformance
    # step itself needs up to 90 min (322 focused specs, single ginkgo
    # thread). Job ceiling must clear build + 90 + teardown, hence 150.
    timeout-minutes: 150

    steps:
      - name: Checkout
        # rhino is an in-tree submodule (./rhino, indyjonesnl/rhino). The
        # storage crate's Cargo.toml references `path = "../../rhino"` and the
        # compose files expose it as a named build context
        # (`additional_contexts: rhino: ./rhino`). submodules: recursive
        # checks it out at the pinned commit so the compose build finds it.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confirm Docker daemon
        run: |
          docker version
          docker info --format '{{ .ServerVersion }}'

      - name: Check docker-compose v2 plugin
        # The runner image (ci/arc-runner/Dockerfile) bakes in v2.30.3.
        # Fail fast if the plugin is missing or older than the floor —
        # rebuilding the runner image is the correct fix, not papering
        # over it in this workflow.
        env:
          REQUIRED_COMPOSE_VERSION: v2.30.0
        run: |
          set -euo pipefail
          if ! docker compose version --short >/dev/null 2>&1; then
            echo "docker compose plugin missing — rebuild the ARC runner image (ci/arc-runner/Dockerfile)" >&2
            exit 1
          fi
          ACTUAL="v$(docker compose version --short)"
          if ! printf '%s\n%s\n' "$REQUIRED_COMPOSE_VERSION" "$ACTUAL" | sort -V -C; then
            echo "docker compose $ACTUAL is older than required $REQUIRED_COMPOSE_VERSION — rebuild the ARC runner image (ci/arc-runner/Dockerfile)" >&2
            exit 1
          fi
          echo "docker compose $ACTUAL (>= $REQUIRED_COMPOSE_VERSION)"

      - name: Generate TLS certs
        run: |
          bash scripts/generate-certs.sh

      - name: Set KUBELET_VOLUMES_PATH
        run: |
          echo "KUBELET_VOLUMES_PATH=$GITHUB_WORKSPACE/.rusternetes/volumes" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.rusternetes/volumes"

      - name: Write kubeconfig
        # The repo doesn't ship a kubeconfig — it's user-maintained
        # locally at ~/.kube/rusternetes-config. Construct a minimal
        # one for the runner. Inside the runner pod (which shares its
        # network namespace with the dind sidecar), the api-server's
        # published port 6443 is reachable on localhost. `--skip-auth`
        # on the api-server (compose.sqlite.yml) means any bearer token is
        # accepted, so the placeholder works.
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/rusternetes-config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: rusternetes
              cluster:
                insecure-skip-tls-verify: true
                server: https://localhost:6443
          contexts:
            - name: rusternetes
              context:
                cluster: rusternetes
                user: admin
          current-context: rusternetes
          users:
            - name: admin
              user:
                token: anonymous
          EOF
          echo "KUBECONFIG=$HOME/.kube/rusternetes-config" >> "$GITHUB_ENV"

      - name: Install kubectl
        # The ARC runner image (ci/arc-runner/Dockerfile) bakes Rust + protoc
        # + docker-compose but not kubectl, so `kubectl ... 2>/dev/null`
        # silently 127's and any wait-loop spins forever (run 26127584434
        # timed out for exactly this reason). Pin to v1.35 to match the
        # conformance image so kubectl never lags the cluster API surface.
        # Drop into the runner user's local bin and append to GITHUB_PATH
        # — no sudo (the runner image's sudo config is not guaranteed).
        run: |
          set -euo pipefail
          KUBECTL_VERSION="v1.35.0"
          mkdir -p "$HOME/.local/bin"
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kubectl" version --client

      - name: Build images
        # Build before `up -d` so the up step is a fast container-start
        # rather than a slow build. Parallel build keeps wall time
        # reasonable on the 3-core conformance tier.
        run: |
          docker compose -f compose.sqlite.yml -f compose.dind.yml build --parallel

      - name: Bring up cluster
        run: |
          # Initial up creates the bridge network (needed before we can
          # discover the gateway.  KUBERNETES_SERVICE_HOST_OVERRIDE will
          # be wrong until the restart step below.
          docker compose -f compose.sqlite.yml -f compose.dind.yml up -d
          docker compose -f compose.sqlite.yml -f compose.dind.yml ps

      - id: discover-gateway
        name: Discover docker bridge gateway
        run: |
          GW=$(docker network inspect rusternetes-network -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || echo "")
          if [ -z "$GW" ]; then
            GW=$(ip route show | grep "docker0" | grep -oP 'inet\K[0-9./]+' | head -1 | cut -d/ -f1 | rev | cut -d. -f2,3,4 | rev | sed 's/\.[0-9]*$/.1/')
          fi
          if [ -z "$GW" ]; then
            echo "ERROR: Could not discover docker bridge gateway" >&2
            exit 1
          fi
          echo "gateway=$GW" >> "$GITHUB_OUTPUT"
          echo "export DOCKER_GATEWAY=$GW" >> "$GITHUB_ENV"
          echo "Docker bridge gateway: $GW"

      - name: Restart cluster with discovered gateway
        # Write .env so compose interpolates the real gateway on restart.
        # The kubelet inside the container now sees the correct IP.
        run: |
          echo "DOCKER_GATEWAY=${{ steps.discover-gateway.outputs.gateway }}" > .env
          echo "KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}" >> .env
          docker compose -f compose.sqlite.yml -f compose.dind.yml up -d
          docker compose -f compose.sqlite.yml -f compose.dind.yml ps

      - name: Wait for api-server health
        timeout-minutes: 3
        run: |
          # Runner default `bash -e` makes `OUT=$(kubectl ... 2>&1)` exit
          # silently on the first kubectl failure: bash propagates the
          # non-zero status of the command substitution and dies before
          # `RC=$?` runs. The whole step died in <100ms with no output
          # (run 26359713718, 2026-05-24). The retry loop *expects*
          # kubectl to fail until api-server is listening, so opt out of -e.
          set +e
          # Earlier loop piped kubectl through `grep -q ok`, which swallowed
          # every stderr line (run 26147385703 — 3 min of "waiting" with no
          # diagnostic). Surface the actual kubectl output each iteration so
          # the failure mode (TLS, refused, no route) is visible in the log.
          for i in $(seq 1 90); do
            OUT=$(kubectl get --raw=/healthz 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q ok; then
              echo "api-server healthy after ${i} attempts: $OUT"
              kubectl get nodes
              exit 0
            fi
            printf '[%02d] kubectl rc=%d: %s\n' "$i" "$RC" "$OUT"
            sleep 2
          done
          echo "api-server never became healthy — dumping diagnostics:"
          docker compose -f compose.sqlite.yml -f compose.dind.yml ps || true
          docker compose -f compose.sqlite.yml -f compose.dind.yml logs --tail=50 rusternetes || true
          curl -kv --max-time 5 https://127.0.0.1:6443/healthz || true
          curl -kv --max-time 5 https://localhost:6443/healthz || true
          exit 1

      - name: Bootstrap cluster (CoreDNS, services, SA tokens)
        run: bash scripts/bootstrap-cluster.sh

      - name: Install Hydrophone
        # Pinned binary; the canary script (next step) expects it on PATH.
        run: |
          set -e
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/hydrophone.tar.gz \
            "https://github.com/kubernetes-sigs/hydrophone/releases/download/${HYDROPHONE_VERSION}/hydrophone_Linux_x86_64.tar.gz"
          tar -xzf /tmp/hydrophone.tar.gz -C "$HOME/.local/bin" hydrophone
          chmod +x "$HOME/.local/bin/hydrophone"
          hydrophone --help | head -5

      - name: Run conformance canary
        # `scripts/conformance-canary-run.sh` reads ci/conformance/known-green.txt,
        # builds a single hydrophone --focus regex (alternation of all entries,
        # regex-escaped per entry), runs hydrophone, parses the junit, and
        # exits non-zero if any expected-green test does not pass. Pins the
        # conformance image to v1.35.0 by default — see the script's --help.
        # 322 focused specs on a single ginkgo thread; 15 min was too tight
        # (run 26633232630 ran out mid-suite). Self-hosted runner, no GH
        # minute cost, so give it room.
        timeout-minutes: 90
        run: |
          bash scripts/conformance-canary-run.sh \
            --output-dir conformance-out

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-out
          path: conformance-out/
          retention-days: 14

      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f compose.sqlite.yml -f compose.dind.yml logs --tail=200 || true
          docker compose -f compose.sqlite.yml -f compose.dind.yml down -v || true
