# Override: skip in-Docker cargo build, consume host-built binaries.
#
# Use with:
#   cargo build --release --bin api-server --bin kubelet
#   docker compose -f compose.node-conformance.yml \
#                  -f compose.local-binary.node-conformance.yml \
#                  up -d --build
#
# Drops --console-dir (no console assets in this runtime image) and
# swaps the Dockerfile to the cargo-less variant.

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.local-binary.services
      target: api-server
    command:
      - "--bind-address"
      - "0.0.0.0:6443"
      - "--etcd-servers"
      - "http://rhino:2379"
      - "--tls"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      - "--skip-auth"
      - "--log-level"
      - "info"

  kubelet:
    build:
      context: .
      dockerfile: Dockerfile.local-binary.services
      target: kubelet
